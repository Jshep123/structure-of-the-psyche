  ids.forEach(id=>{ const p=PROMPT_INDEX[id]; if(!p) return; (groups[p.owner]=groups[p.owner]||{name:p.name,kind:p.kind,items:[]}).items.push({id,q:p.q,e:S.entries[id]}); });
  const order=[...EXERCISES.map(e=>e.id),...FIGURES.map(f=>f.id)].filter(k=>groups[k]);
  const body = order.length ? order.map(k=>`<div class="nbsec"><p class="num">${groups[k].kind==='figure'?'figure':'exercise'}</p><h2 class="sec"><a href="#/${groups[k].kind}/${k}" style="text-decoration:none;color:inherit">${esc(groups[k].name)}</a></h2>
      ${groups[k].items.map(it=>`<div class="entry"><p class="q">${esc(it.q)}</p><p class="a">${esc(it.e.t)}</p><p class="when">${esc(fmtWhen(it.e.u))}</p></div>`).join('')}</div>`).join('')
    : '<p class="col">Nothing written yet. Anything you type into an exercise or figure prompt appears here, saved in this browser only.</p>';
  return `<div class="screen">
    <p class="num">Notebook</p>
    <h1 class="pg" data-focus tabindex="-1">Everything you have written</h1>
    <p class="col">${ids.length} ${ids.length===1?'entry':'entries'}, stored locally${S.started?` since ${esc(fmtWhen(S.started))}`:''}. Export makes a file you can keep; Import reads one back; Print produces the whole guide with your entries.</p>
    ${btnRow(`<button class="btn ghost" id="export">Export as a file</button> <a class="btn ghost" href="#/print">Print everything</a> <button class="btn ghost" id="importBtn">Import a file</button> <button class="btn ghost danger" id="clear">Clear everything</button> <span class="said" id="said" role="status"></span>`)}
    <div class="dialog" id="importBox" hidden>
      <p style="margin-bottom:8px">Choose a notebook file exported from this companion.</p>
      <input type="file" id="importFile" accept="application/json,.json">
      <div class="btnrow" style="margin-top:12px"><button class="btn small" id="importMerge">Merge into this notebook</button><button class="btn small ghost" id="importReplace">Replace this notebook</button><button class="lnk" id="importCancel">Cancel</button></div>
    </div>
    <div class="dialog" id="clearBox" hidden>
      <p style="margin-bottom:8px">This deletes every entry and selection stored by this companion in this browser. It cannot be undone; export first if you want to keep anything.</p>
      <div class="btnrow" style="margin-top:8px"><button class="btn small danger ghost" id="clearYes">Delete everything</button><button class="lnk" id="clearNo">Keep it</button></div>
    </div>
    <div class="wide">${body}</div>
  </div>`;
}

/* ---------- print view: guide + exercises + entries ---------- */
function viewPrint(){
  const G=buildGuide();
  const list=[...G.items.map(i=>i.ex), ...G.rest];
  const exBlock=ex=>`<div style="break-before:page"><p class="num">Exercise ${esc(ex.num)}</p><h2>${esc(ex.name)}</h2><p class="k" style="font-style:italic;color:var(--brass)">${esc(ex.kicker)}</p><p>${esc(ex.summary)}</p>${tailoredFor(ex)}${ex.parts.map(p=>partHTML(p,ex)).join('')}<section class="part"><div class="head"><h2 class="sec">Sources</h2></div>${sourcesList(ex.sources)}</section></div>`;
  const figBlock=f=>`<div style="break-before:page"><p class="num">Figure</p><h2>${esc(f.name)}</h2><p class="k" style="font-style:italic;color:var(--brass)">${esc(f.epithet)}</p><p class="origin">${f.originNote}</p>
    <section class="part"><div class="head">${tag('project')}<h2 class="sec">The image</h2></div>${f.image}</section><section class="part"><div class="head">${tag('jung')}<h2 class="sec">What Jung wrote</h2></div>${f.jung}</section><section class="part"><div class="head">${tag('project')}<h2 class="sec">Where it turns up</h2></div>${f.appears}</section><section class="part"><div class="head">${tag('later')}<h2 class="sec">What came after</h2></div>${f.later}</section>
    <section class="part"><div class="head">${tag('project')}<h2 class="sec">Prompts</h2></div>${f.prompts.map(pr=>`<div class="prompt"><label>${esc(pr.q)}</label><div class="printed" style="display:block">${esc(entry(pr.id)||'—')}</div></div>`).join('')}</section>
    <section class="part"><div class="head">${tag('project')}<h2 class="sec">Other readings</h2></div>${f.other}</section><section class="part"><div class="head"><h2 class="sec">Sources</h2></div>${sourcesList(f.sources)}</section></div>`;
  return `<div class="screen print-view">
    <div class="noprint">${btnRow(`<button class="btn" id="doPrint">Print or save as PDF</button> <a class="lnk" href="#/guide">Back to the guide</a>`)}<p class="note">This page lays out your guide, every exercise in your guide’s order, the figures you chose, and everything you have written, for printing. Written entries print in full.</p></div>
    <h1 data-focus tabindex="-1">The Structure<br>of the <em>Psyche</em></h1>
    <p class="sub">${esc(META.subtitle)} · printed ${esc(fmtWhen(new Date().toISOString()))}</p>
    <p class="num">Your guide</p>
    ${hasSelections()?`<p>Assembled from your choices and notes, and from nothing else.</p><div class="wide">${G.items.map(it=>`<div class="card"><p class="num">${esc(it.ex.num)}</p><h3>${esc(it.ex.name)}</h3><div class="reflect" style="margin:6px 0 0">${it.reasons.map(reasonLine).join('')}</div></div>`).join('')}</div>`:'<p>No starting points were chosen; all exercises follow in the companion’s order.</p>'}
    ${list.map(exBlock).join('')}
    ${G.figIds.map(id=>figBlock(FIG(id))).join('')}
    <div style="break-before:page"><p class="num">About this document</p><h2>What this is and isn’t</h2>${ABOUT.paras.map(p=>`<p>${p}</p>`).join('')}<p class="note">${ABOUT.citing}</p></div>
  </div>`;
}

/* ---------- about & sources ---------- */
function viewAbout(){
  return `<div class="screen about">
    <p class="num">About</p>
    <h1 class="pg" data-focus tabindex="-1">What this companion is, and isn’t</h1>
    <div class="col">${ABOUT.paras.map(p=>`<p>${p}</p>`).join('')}</div>
    <div class="legend col" aria-label="Attribution labels">${Object.keys(LABELS).map(k=>`<div>${tag(k)}<span>${esc(LABELS[k].desc)}</span></div>`).join('')}</div>
    <h2 class="sec" style="margin-top:30px">How Jung is cited</h2><p class="col">${ABOUT.citing}</p>
    <h2 class="sec" style="margin-top:30px">Privacy</h2><p class="col">${ABOUT.privacy}</p>
    <h2 class="sec" style="margin-top:30px">Documents</h2><p class="col">Three documents accompany this file: a <em>Companion Guide and Technical Manual</em> (every prompt, how the guide is assembled, how to add episodes), <em>Sources and Further Reading</em> (with a note on how each quotation was verified), and a <em>Research Report</em> (what Jung wrote, what came after, and what a self-guided exercise can honestly do). A <em>Sample Guide</em> shows what a printed guide looks like. <a href="#/sources">The full source list is also here.</a></p>
    <p class="note col">Version ${esc(META.version)} · September 2026 · The Structure of the Psyche began as a scored inventory (<code>psy2</code>); this companion replaces it, and the earlier version is preserved separately.</p>
  </div>`;
}
function viewSources(){
  const groups={jung:[],later:[],research:[]};
  const seen=new Set();
  [...EXERCISES,...FIGURES].forEach(x=>x.sources.forEach(s=>{ const key=s.label+'|'+s.text; if(seen.has(key)) return; seen.add(key); (groups[s.label]||groups.later).push(s.text); }));
  const block=(l,title)=>`<h2 class="sec" style="margin-top:28px">${tag(l)} ${esc(title)}</h2><div class="sources"><ul>${groups[l].map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
  return `<div class="screen">
    <p class="num">Sources</p>
    <h1 class="pg" data-focus tabindex="-1">Everything the exercises and figures cite</h1>
    <p class="col">Gathered from every page, grouped by attribution. The separate <em>Sources and Further Reading</em> document adds what was actually consulted, in which editions, and how each quotation was verified.</p>
    <div class="wide">${block('jung','Jung’s writings')}${block('later','Later writers')}${block('research','Research')}</div>
  </div>`;
}
function viewNotFound(h){
  return `<div class="screen"><p class="num">Not found</p><h1 class="pg" data-focus tabindex="-1">There is no page at <code>${esc(h)}</code></h1><p class="col">Exercises live at <code>#/exercise/…</code> and figures at <code>#/figure/…</code>.</p>${btnRow('<a class="btn" href="#/">Start again</a> <a class="btn ghost" href="#/exercises">The exercises</a>')}</div>`;
}

/* ---------- wiring after each render ---------- */
function afterRender(main){
  // textareas: autosave
  main.querySelectorAll('textarea[data-prompt]').forEach(ta=>{
    ta.addEventListener('input',()=>{ setEntry(ta.dataset.prompt, ta.value); const m=main.querySelector(`[data-pmeta="${ta.dataset.prompt}"]`); if(m) m.textContent='saving…'; });
    ta.addEventListener('blur',()=>{ if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; save(); } const m=main.querySelector(`[data-pmeta="${ta.dataset.prompt}"]`); if(m) m.textContent=S.entries[ta.dataset.prompt]?`saved ${fmtWhen(S.entries[ta.dataset.prompt].u)}`:'not yet written'; });
  });
  // intake
  main.querySelectorAll('input[data-interest]').forEach(cb=>cb.addEventListener('change',()=>{
    const id=cb.dataset.interest; S.interests=S.interests.filter(x=>x!==id); if(cb.checked) S.interests.push(id);
    if(!S.started) S.started=new Date().toISOString(); save(true);
    cb.closest('.choice').classList.toggle('on',cb.checked);
    main.querySelectorAll('input[data-interest]').forEach(o=>{ const i=S.interests.indexOf(o.dataset.interest); o.closest('.choice').querySelector('.ord').textContent=i<0?'':String(i+1); });
  }));
  main.querySelectorAll('input[data-exp]').forEach(r=>r.addEventListener('change',()=>{ if(!r.checked) return; S.exp[r.dataset.exp]=r.value; if(!S.started) S.started=new Date().toISOString(); save(true); r.closest('.row').classList.add('on'); }));
  main.querySelectorAll('input[data-dream]').forEach(r=>r.addEventListener('change',()=>{ if(r.checked){ S.dream=r.dataset.dream; if(!S.started) S.started=new Date().toISOString(); save(true);} }));
  main.querySelectorAll('input[data-fig]').forEach(cb=>cb.addEventListener('change',()=>{ const id=cb.dataset.fig; S.figs=S.figs.filter(x=>x!==id); if(cb.checked) S.figs.push(id); if(!S.started) S.started=new Date().toISOString(); save(true); }));
  main.querySelectorAll('[data-togglefig]').forEach(b=>b.addEventListener('click',()=>{ const id=b.dataset.togglefig; const on=S.figs.includes(id); S.figs=on?S.figs.filter(x=>x!==id):[...S.figs,id]; if(!S.started) S.started=new Date().toISOString(); save(true); b.textContent=on?'Add to my guide':'✓ In my guide — remove'; b.setAttribute('aria-pressed',String(!on)); }));
  // copy buttons
  const said=m=>{ const el=main.querySelector('#said'); if(!el) return; el.textContent=m; setTimeout(()=>{ if(el.textContent===m) el.textContent=''; },2600); };
  main.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',async()=>{ said(await copyText(b.dataset.copy)?'Link copied':'Couldn’t copy — select the link and copy it by hand'); }));
  const cg=main.querySelector('#copyGuide'); if(cg) cg.addEventListener('click',async()=>{ said(await copyText(guideLink())?'Guide link copied (selections only)':'Couldn’t copy the link'); });
  // video: load on demand only
  main.querySelectorAll('[data-loadvideo]').forEach(b=>b.addEventListener('click',()=>{
    const fr=main.querySelector('#vframe'); if(!fr) return;
    fr.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(b.dataset.loadvideo)}" title="Related video" allow="encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
    b.disabled=true; b.textContent='Video loaded';
  }));
  // notebook
  const ex=main.querySelector('#export'); if(ex) ex.addEventListener('click',()=>{ exportJSON().then(said); });
  const ib=main.querySelector('#importBtn'); if(ib) ib.addEventListener('click',()=>{ const box=main.querySelector('#importBox'); box.hidden=false; main.querySelector('#clearBox').hidden=true; main.querySelector('#importFile').focus(); });
  const ic=main.querySelector('#importCancel'); if(ic) ic.addEventListener('click',()=>{ main.querySelector('#importBox').hidden=true; });
  const doImport=async mode=>{ const f=main.querySelector('#importFile').files[0]; if(!f){ said('Choose a file first'); return; } try{ await importJSON(f,mode); render(); say('Imported'); }catch(e){ said(e.message); } };
  const im=main.querySelector('#importMerge'); if(im) im.addEventListener('click',()=>doImport('merge'));
  const ir=main.querySelector('#importReplace'); if(ir) ir.addEventListener('click',()=>doImport('replace'));
  const cl=main.querySelector('#clear'); if(cl) cl.addEventListener('click',()=>{ const box=main.querySelector('#clearBox'); box.hidden=false; main.querySelector('#importBox').hidden=true; main.querySelector('#clearYes').focus(); });
  const cn=main.querySelector('#clearNo'); if(cn) cn.addEventListener('click',()=>{ main.querySelector('#clearBox').hidden=true; });
  const cy=main.querySelector('#clearYes'); if(cy) cy.addEventListener('click',()=>{ resetAll(); render(); say('Everything cleared'); });
  const dp=main.querySelector('#doPrint'); if(dp) dp.addEventListener('click',()=>window.print());
}

</script>
</body>
</html>
