{ id: 'self', num: 'Seven', name: 'Direction, wholeness and its risks',
  kicker: 'the Self, individuation, and Jung’s warning about inflation',
  summary: 'Jung called the Self “a transcendental concept”, known only through spontaneous symbols and long work, and warned that inflation is not felt as inflation. There is nothing here to score. The exercise takes your own experiences of direction and meaning, sets an ordinary explanation beside each, and keeps the guard-rail Jung built.',
  minutes: '25–40',
  video: { url: '', title: 'The Self: centre, circumference, and the danger of inflation' },
  tailor: {
    direction: 'You noted that, looking back, your life seems to have been going somewhere you couldn’t see at the time. The second prompt asks you to tell that twice — once as a story with a direction, once as a series of accidents — because Jung’s idea and the ordinary one can both be true and the difference is instructive.',
    coincidence: 'You noted a coincidence that felt meaningful. The third prompt is written for it. The companion treats this neither as evidence of anything nor as foolishness: the research says who tends to notice coincidences, not whether they mean something.',
    afternoon: 'You noted that what you used to want no longer moves you as it did. That is the hinge of Jung’s “afternoon of life”, taken up in the next exercise; here it belongs to the fifth prompt, on what has been excluded to keep the rest coherent.'
  },
  parts: [
    { kind: 'text', label: 'jung', heading: 'What Jung wrote',
      html: `<p>“As an empirical concept, the self designates the whole range of psychic phenomena in man. It expresses the unity of the personality as a whole … It is a transcendental concept”, and “in part, only potentially empirical and … to that extent a postulate” (CW 6 §789°). “I have suggested calling the total personality which, though present, cannot be fully known, the self” (CW 9ii §5). “The self is not only the centre, but also the whole circumference which embraces both conscious and unconscious” (CW 12 §44°). Individuation “means to become a single, discrete being … becoming one’s own real self” (Baynes 1928, p. 183 ≈ CW 7 §266); it is not individualism, because it “means precisely a better and more complete fulfilment of the collective dispositions of mankind” (≈ §267–268) and “must lead to more intense and broader collective relationships and not to isolation” (CW 6 §758°). Its centre lies “midway between the conscious and the unconscious … a virtual centre” (Baynes 1928, p. 243 ≈ CW 7 §365). “The goal is important only as an idea; the essential thing is the opus which leads to the goal: that is the goal of a lifetime” (CW 16 §400°).</p>
<p>How is any of this known? Through symbols that arrive on their own. Wholeness “is nevertheless empirical in so far as it is anticipated by the psyche in the form of spontaneous or autonomous symbols. These are the quaternity or mandala symbols, which occur not only in the dreams of modern people who have never heard of them, but are widely disseminated in the historical records of many peoples and many epochs” (CW 9ii, ch. IV ≈ §59). And slowly: “The mandala at first comes into the conscious mind as an unimpressive point or dot, and a great deal of hard and painstaking work as well as the integration of many projections are generally required before the full range of the symbol can be anything like completely understood” (≈ §60). Clinically, mandalas appear “in states of chaos or panic” (CW 9i, “Concerning Mandala Symbolism”).</p>
<p>Then the warning. Assimilating unconscious contents “inevitably produces an inflation of the ego, unless a critical line of demarcation is drawn between it and the unconscious figures” (CW 9ii §44); “it must be reckoned a psychic catastrophe when the ego is assimilated by the self”; “inflation magnifies the blind spot in the eye” (≈ §45–46); and, crucially, “in general we are not directly conscious of this condition at all” (§44°). “An inflated consciousness is always egocentric and conscious of nothing but its own existence … It is hypnotised by itself and therefore cannot be argued with” (CW 12 §563°). Its social forms, in the 1928 text: becoming “the lucky possessor of the great truth … the prophet, reformer, and martyr”, or “the disciple of a prophet”, for whom “spiritual laziness becomes a virtue” (Baynes 1928, pp. 179–181 ≈ CW 7 §260–263). Nothing Jung wrote proposes a scale for any of this.</p>` },
    { kind: 'text', label: 'later', heading: 'What came after',
      html: `<p>Edward Edinger (<em>Ego and Archetype</em>, 1972) drew the “ego–Self axis” — Neumann’s term — as a cycle of inflation, alienation and renewal. Michael Fordham and the London developmental school placed a “primary self” in infancy that “deintegrates” into experience and reintegrates, so that individuation begins at birth rather than in the second half of life. James Hillman rejected the centring Self altogether: “the soul’s inherent multiplicity demands a theological fantasy of equal differentiation” (1983) — a polytheistic psyche with no single goal. Polly Young-Eisendrath criticises “the essentialist Jungian theory of Self in which the Self is frequently described as a human subject with views, intentions and desires of its own” (2008). These are real disagreements, and this exercise does not adjudicate them; it uses Jung’s account as one lens and says which parts are contested.</p>` },
    { kind: 'text', label: 'research', heading: 'What the evidence says',
      html: `<p>There is no validated questionnaire of Jungian individuation or of the Self; the instruments that carry the word “individuation” measure adolescent separation, family “differentiation of self” or a construct from acceptance-and-commitment therapy — different things. Reported detection of meaningful coincidences is a stable individual difference associated with referential thinking, faith in intuition, search for meaning, religiosity and emotional intensity (Coleman &amp; Beitman 2009; N = 681); that says who notices, not what it means. Dream recall is discussed in the dreams exercise. And any text generated about your “wholeness” from your answers would be accepted most readily when it is favourable and personalised (Dickson &amp; Kelly 1985) — which is why this exercise generates none.</p>` },
    { kind: 'prompts', label: 'project', heading: 'The exercise',
      intro: 'Your experiences, in your words, each with an ordinary explanation beside it. “Nothing of the kind, and I don’t miss it” is a complete and normal answer to any of these.',
      prompts: [
        { id: 'w1', q: 'Has there been a moment when you felt moved by something larger than your plans — a decision that seemed to make itself, a turn you did not choose and would not undo? Describe it. Then describe the ordinary explanation. Both can be true.',
          help: 'Jung’s Self is “a virtual centre” that the ego does not control. Chance, other people, tiredness and hindsight are the competing accounts; write them down with the same care.' },
        { id: 'w2', q: 'Looking back, is there a pattern in your life that seems to have been going somewhere? Tell it once as a story with a direction, and once as a series of accidents. Which telling do you trust more, and why?',
          help: 'The earlier inventory scored agreement with the first telling. Here the second is required too. Jung’s “prospective” reading of the psyche is a hypothesis about the future seen in hindsight — the easiest place to see patterns that were never there.' },
        { id: 'w3', q: 'A coincidence that felt meaningful: what happened, what did it mean to you, and what else could account for it?',
          help: 'Jung proposed synchronicity as “a principle sui generis”, not as a personal-growth marker, and said he could not explain such events. Meaning to you is real either way; it is not evidence of an order in things.' },
        { id: 'w4', q: 'Jung’s guard against inflation: which image or idea about yourself would you find hardest to have corrected? Who, if anyone, is allowed to correct it — and when did they last do so?',
          help: 'This is the exercise’s most important question, because Jung says inflation is not felt as inflation. An inner conviction that “cannot be argued with” is his exact description of the danger.' },
        { id: 'w5', q: 'Wholeness rather than perfection: what part of you have you excluded to keep the rest coherent — a wish, an ability, a feeling, a memory — and what would including it cost?',
          help: 'Jung’s compensation idea applied to a life: what consciousness excludes forms a counterweight. The cost is real; name it rather than resolving to pay it.' }
      ],
      closing: 'A step forward: tell someone who knows you well what you wrote for the fourth question, and ask them to correct one thing. Jung’s individuation leads “to more intense and broader collective relationships and not to isolation”; the test of a compelling inner image is whether it survives another person.' },
    { kind: 'text', label: 'project', heading: 'Exceptions and other readings',
      html: `<p>None of this is a stage, and there is no ladder. A life without any of these experiences is not a life without depth; Jung himself said mandala symbols are met “in relatively few cases in a distinct form” (Dell 1940, p. 194). A strong sense of direction can be a symptom as easily as a gift, and Jung’s pages on the prophet and the disciple are the reason this exercise keeps asking who is allowed to correct you. Religious and secular readers will read the “God within us” (CW 7 §399°) differently, and Jung insisted his statements were psychological, not theological. If a sense of being guided ever comes with commands, or with a certainty that isolates you from the people who love you, that is exactly the condition Jung called a catastrophe, and it is a reason to talk to someone now.</p>` }
  ],
  sources: [
    { label: 'jung', text: 'Jung, C. G. <em>Psychological Types</em>, CW 6 Definitions “Self” §789–791°, “Individuation” §757–762°. <em>Two Essays</em>, CW 7 §221–243 (inflation; §243 n.1°), ≈ §260–263 (identification with the collective psyche), §266–269° (individuation), ≈ §365 (the midpoint), §374–406° (the mana-personality; §399° “God within us”), §404°; Baynes translation 1928, pp. 140–142, 179–185, 243. <em>Aion</em>, CW 9ii ch. I §1–12 (§5), ch. IV “The Self” §43–67 (pp. 23–34). <em>Psychology and Alchemy</em>, CW 12 §44°, §563°; the 1936 text in Dell (trans.) <em>The Integration of the Personality</em> (1940), pp. 96, 194. <em>The Archetypes and the Collective Unconscious</em>, CW 9i, “Concerning Mandala Symbolism” §627–712 (§645°); “Conscious, Unconscious, and Individuation” §489–524. <em>The Practice of Psychotherapy</em>, CW 16 §400°, §448°. “On the Nature of the Psyche”, CW 8 §430°, §432°. “Synchronicity: An Acausal Connecting Principle” (1952), CW 8 §816–968.' },
    { label: 'later', text: 'Edinger, E. F. <em>Ego and Archetype</em> (1972). Neumann, E. <em>The Child</em> (1963; Eng. 1973). Fordham, M. <em>Explorations into the Self</em> (1985); Urban, E. “Fordham, Jung and the self”, <em>Journal of Analytical Psychology</em> 50 (2005). Hillman, J. <em>Archetypal Psychology: A Brief Account</em> (1983); <em>Re-Visioning Psychology</em> (1975). Young-Eisendrath, P. “The self in analysis”, <em>Journal of Analytical Psychology</em> 53 (2008).' },
    { label: 'research', text: 'Coleman, S. L. &amp; Beitman, B. D. “Characterizing high-frequency coincidence detectors”, <em>Psychiatric Annals</em> 39 (2009). Dickson, D. H. &amp; Kelly, I. W. “The ‘Barnum effect’ in personality assessment”, <em>Psychological Reports</em> 57 (1985). Takano, K. &amp; Tanno, Y. “Self-rumination, self-reflection, and depression”, <em>Behaviour Research and Therapy</em> 47 (2009).' }
  ]
},

/* ------------------------------------------------------------ 8 */
{ id: 'stages', num: 'Eight', name: 'Morning and afternoon',
  kicker: 'the stages of life, with Jung’s own caveat',
  summary: 'A short exercise on Jung’s image of life’s morning and afternoon — the one lecture in which he asked to be read with a question mark — and on what has changed in what your life is for.',
  minutes: '15',
  video: { url: '', title: 'The stages of life' },
  tailor: {
    afternoon: 'You noted that what you used to want no longer moves you as it did. Jung’s sentence about the afternoon of life is often quoted as a comfort; read with his caveat it is a question, which the prompts below put to you directly.',
    roleloss: 'You noted a role that ended or changed. Jung’s lecture treats the transitions of life as “problems … which allow of more than one answer”; the second prompt asks which programme you have been running.',
    unstarted: 'You noted that part of your life feels as if it hasn’t started. Von Franz called that feeling the “provisional life” (her phrase from H. G. Baynes) and her prescription was work; the puer figure in the gallery takes it up. Here the first prompt asks what is being waited for.'
  },
  parts: [
    { kind: 'text', label: 'jung', heading: 'What Jung wrote',
      html: `<p>“We cannot live the afternoon of life according to the programme of life’s morning; for what was great in the morning will be little at evening, and what in the morning was true will at evening have become a lie” (CW 8 §784, “The Stages of Life”, 1930). “Thoroughly unprepared we take the step into the afternoon of life; worse still, we take this step with the false assumption that our truths and ideals will serve us as hitherto.” “The afternoon of human life must also have a significance of its own” (§785). But the lecture opens with a caveat rarely quoted: the subject “can be carried out only on the broadest lines … We shall restrict ourselves … to questions which allow of more than one answer — and, moreover, answers that are always open to doubt. For this reason there will be much to which we must add a question mark in our thoughts” (§749).</p>` },
    { kind: 'text', label: 'later', heading: 'What came after',
      html: `<p>Jung’s emphasis on the second half of life shaped the classical school; the developmental school reversed it. Michael Fordham held that individuation occurs from birth, the infant “far from being uncentred at birth, as Jung originally thought” (Society of Analytical Psychology). Marie-Louise von Franz described the “provisional life” of the puer aeternus — “the strange attitude and feeling that one is not yet in real life” — and credited the phrase to H. G. Baynes (<em>The Problem of the Puer Aeternus</em>, 1970, p. 8). Between them, Jung’s morning-and-afternoon has become one map among several rather than the map.</p>` },
    { kind: 'text', label: 'research', heading: 'What the evidence says',
      html: `<p>The lifespan literature finds change in what people value and attend to across adulthood, but no single turning-point at a fixed age, and the popular “midlife crisis” is not a reliable general event. (This is the field’s general finding; no specific study of it was consulted for this companion, and the claim is offered with that limit.) Jung’s illustrative ages — the mid-thirties onward — are best read as illustrations, which is how he presented them: “on the broadest lines”.</p>` },
    { kind: 'prompts', label: 'project', heading: 'The exercise',
      intro: 'Two questions and a comparison.',
      prompts: [
        { id: 'l1', q: 'What did you want at twenty that you still want? What no longer moves you at all? What, if anything, has taken its place — and is any part of you still waiting for something to begin?',
          help: 'Write all four parts. The third is the one Jung was interested in; the fourth is von Franz’s.' },
        { id: 'l2', q: 'Jung’s claim is that the morning’s programme becomes a lie in the afternoon. Which programme have you been running — and would an afternoon programme, for you, be more about limitation, simplification and depth, or something else entirely?',
          help: 'Jung wrote elsewhere that the descent toward life’s afternoon “demands simplification, limitation, and intensification” (CW 8, “On Psychic Energy”, 1960 ed., p. 59). That is his answer; yours may differ, and the lecture invites the difference.' }
      ],
      closing: 'A step forward: do one thing this week that belongs to the afternoon programme you described and to no other. Keep it small.' },
    { kind: 'text', label: 'project', heading: 'Exceptions and other readings',
      html: `<p>There is no fixed age, and there are lives whose afternoon comes early, late or several times. A loss of appetite for what once mattered can be depression rather than development and should be treated as such if it comes with the other signs. And “the second half of life” was, for Jung, a European professional’s schedule; it does not describe everyone’s.</p>` }
  ],
  sources: [
    { label: 'jung', text: 'Jung, C. G. “The Stages of Life” (1930/31), CW 8 §749–795 (§749, §784–785; Pantheon 1960 printing, pp. 387–403). “On Psychic Energy”, CW 8 (1960 ed., p. 59).' },
    { label: 'later', text: 'Fordham, M. <em>Children as Individuals</em> (1969). Society of Analytical Psychology, “Michael Fordham” (biographical page). von Franz, M.-L. <em>The Problem of the Puer Aeternus</em> (Inner City, 2000 [1970]), pp. 7–10.' }
  ]
}
];


/* ============================================================

   figures.js · CONTENT ONLY. The gallery of archetypal images.

   project's label), what Jung wrote, where it turns up, what came
   after, prompts, other readings, and sources. No figure is assigned.
   ============================================================ */

const FIGURES_INTRO = {
  lede: 'Images to explore, not identities to adopt.',
  paras: [
    'Jung named some archetypal figures and discussed them at essay length; he also wrote that “there are as many archetypes as there are typical situations in life” (CW 9i §99°), that an archetype “is altered by becoming conscious and by being perceived, and it takes its colour from the individual consciousness in which it happens to appear” (CW 9i §6), and that “the representations themselves are not inherited, only the forms” (§155). He distinguished the figures that “can be directly experienced in personified form” — the shadow, the anima, the wise old man — from “archetypes of transformation”, which “are not personalities, but are typical situations, places, ways and means” and “cannot be exhaustively interpreted” (§80). Nothing in that supports ranking a person by eight figures, and this gallery does not.',
    'Each image below is marked as Jung’s own, as a later writer’s, or as this project’s label. The question the gallery asks is never “which one are you?” but “where have you met this, and what did it ask of you?” Choose the images you want to explore; the choice is yours, not a measurement.',
    'The popular set of twelve “Jungian archetypes” found in online quizzes — caregiver, sage, jester, ruler, magician, explorer, rebel and the rest — is Carol Pearson’s model, as she says herself (“I developed a model in <em>The Hero Within</em> that described six archetypes. Later … I expanded this to a 12-archetype model”). It is not a list found in Jung, and it is not used here.'
  ]
};

const FIGURES = [

{ id: 'mother', name: 'The mother', epithet: 'the loving and the terrible', origin: 'jung',
  originNote: 'Jung’s figure: “Psychological Aspects of the Mother Archetype” (1938/54), CW 9i §148–198.',
  video: { url: '', title: 'The mother archetype' },
  jung: `<p>“Like any other archetype, the mother archetype appears under an almost infinite variety of aspects” (CW 9i §156). Its qualities are “maternal solicitude and sympathy; the magic authority of the female; the wisdom and spiritual exaltation that transcend reason; any helpful instinct or impulse” — and their opposite: Jung “formulated the ambivalence of these attributes as ‘the loving and the terrible mother’” (§158). “The mother archetype forms the foundation of the so-called mother-complex” (§161), which differs for sons and daughters (§162–163) and has positive as well as negative forms (§172 ff.). It is in this essay that Jung insists “archetypes are not determined as regards their content, but only as regards their form and then only to a very limited degree” (§155). And: “A complex can be really overcome only if it is lived out to the full” (§184).</p>`,
  image: `<p>Containment: the capacity to hold, feed and shelter something until it can stand — and the same capacity turned to keeping it dependent. Jung’s image has two faces and the second, he says, does not know it is the second. The tell is not how much is given but what happens when the gift is no longer needed.</p>`,
  appears: `<p>In stories: Demeter and the earth goddesses; the witch in the gingerbread house; the stepmother; the sea, the cave, the garden, the vessel. In life: the person to whose door people arrive; the household that holds together because one person is holding it; institutions that nourish and institutions that will not let go; the mother-complex Jung describes in sons and daughters. In dreams, Jung noted, the figure need not be a mother at all — it can be a place or a thing.</p>`,
  later: `<p>Erich Neumann’s <em>The Great Mother</em> (1955) built a system of the archetype’s “elementary” and “transformative” characters and is the standard elaboration; feminist critics (Rowland 2002; Huff 2022 on the field’s “obsession with matriarchy”) read Neumann’s scheme as reifying gender. Fordham and the developmental school studied the actual mother–infant field rather than the symbol.</p>`,
  prompts: [
    { id: 'f-mother-1', q: 'Where in your life is something held together because you are holding it? What would happen if you stopped for a week — and who, besides you, has noticed the arrangement?' },
    { id: 'f-mother-2', q: 'Describe a time you were held — fed, sheltered, looked after — and a time the same care kept you smaller than you were. What distinguished them?' },
    { id: 'f-mother-3', q: 'Jung says the terrible mother experiences herself as the loving one. Is there care you give that someone might, from the other side, describe as not letting go?' }
  ],
  other: `<p>Caring for people is not a complex. Dependence is often appropriate — children, illness, age — and the “devouring” reading is a question to ask, not a charge to bring. Jung’s essay is about an image and about mother-complexes in adults, not a manual for judging mothers, and its gendered vocabulary (the “magic authority of the female”) belongs to its time. The image is available to anyone who holds.</p>`,
  sources: [
    { label: 'jung', text: 'Jung, C. G. “Psychological Aspects of the Mother Archetype” (1938/54), CW 9i §148–198.' },
    { label: 'later', text: 'Neumann, E. <em>The Great Mother: An Analysis of the Archetype</em> (Bollingen, 1955). Rowland, S. <em>Jung: A Feminist Revision</em> (2002). Huff, T., review in <em>Journal of Jungian Scholarly Studies</em> (2022).' }
  ] },

{ id: 'child', name: 'The child', epithet: 'potential future', origin: 'jung',
  originNote: 'Jung’s figure: “The Psychology of the Child Archetype” (1940), CW 9i §259–305.',
  video: { url: '', title: 'The child archetype' },
  jung: `<p>“One of the essential features of the child-motif is its futurity. The child is potential future … the occurrence of the child-motif in the psychology of the individual signifies as a rule an anticipation of future developments” (CW 9i §278). “The ‘child’ paves the way for a future change of personality … a uniting symbol which unites the opposites; a mediator, bringer of healing, that is, one who makes whole” (§278). The child is “both beginning and end, an initial and a terminal creature” (§299°); “‘child’ means something evolving towards independence. This it cannot do without detaching itself from its origins” (§287°). Its myths are of abandonment and invincibility: “abandonment, exposure, danger, etc., are all elaborations of the ‘child’s’ insignificant beginnings” (§285°). And the warning: “We can never legitimately cut loose from our archetypal foundations unless we are prepared to pay the price of a neurosis” (§267°).</p>`,
  image: `<p>A beginning that is exposed and cannot yet defend itself — and that, in the myths, survives anyway. Jung’s child is not childhood remembered; it is the new thing in a life before it has a name, and the divine child of the stories is a picture of how much is at stake in something that looks small.</p>`,
  appears: `<p>In stories: the foundling, the child in the basket, the divine birth in a stable, the boy who is the hidden king. In life: the project nobody takes seriously yet; the first weeks of a change; a new relationship; recovery; anything that must be protected before it can be shown. In dreams: infants, small animals, eggs, seeds — and, in the puer aeternus, the child that will not grow up (see that figure).</p>`,
  later: `<p>Von Franz made the eternal child a personality pattern (<em>The Problem of the Puer Aeternus</em>, 1970); Hillman defended the puer against being “cured” into the senex; Neumann’s <em>The Child</em> (1963) took the image back into infancy; Fordham studied real children. The “inner child” of popular psychology is a cousin, not the same idea.</p>`,
  prompts: [
    { id: 'f-child-1', q: 'What in your life is new, small and not yet defensible — and how are you protecting it? Who has been told?' },
    { id: 'f-child-2', q: 'Jung’s child must “detach itself from its origins”. What origin — a family, a place, a version of yourself — is something in you still trying to leave?' },
    { id: 'f-child-3', q: 'Describe a moment when something that looked insignificant turned out to be a beginning. How long did it take you to see it?' }
  ],
  other: `<p>A new thing can also be a distraction, and not every beginning deserves protection; Jung’s child is “potential future”, not a guarantee of one. The abandoned child of the myths is not a licence to feel abandoned. And a person who keeps beginning may be closer to the next figure.</p>`,
  sources: [
    { label: 'jung', text: 'Jung, C. G. “The Psychology of the Child Archetype” (1940), CW 9i §259–305; also in Jung &amp; Kerényi, <em>Introduction to a Science of Mythology</em> (1949/1951).' },
    { label: 'later', text: 'Neumann, E. <em>The Child</em> (1963; Eng. 1973). von Franz, M.-L. <em>The Problem of the Puer Aeternus</em> (1970). Hillman, J. “Senex and Puer” (1967).' }
  ] },

{ id: 'maiden', name: 'The maiden', epithet: 'Kore — the one not yet formed', origin: 'jung',
  originNote: 'Jung’s figure: “The Psychological Aspects of the Kore” (1941), CW 9i §306–383.',
  video: { url: '', title: 'The Kore' },
  jung: `<p>The Kore — Persephone, the maiden of the Demeter myth — “has her psychological counterpart in those archetypes which I have called the self or supraordinate personality on the one hand, and the anima on the other” (CW 9i ≈ §306, 1949 wording); “the figure of the Kore … belongs, when observed in a man, to the anima type; and when observed in a woman to the type of supraordinate personality” (≈ §311). “Like the supraordinate personality, the anima is bipolar and can therefore appear positive one moment and negative the next; now young, now old” (≈ §356). “There are types of situations and types of figures that repeat themselves frequently and have a corresponding meaning” (§309°).</p>`,
  image: `<p>Receptivity and unfinishedness: the one who can still be moved, shaped, taken — and, in the myth, taken down into the dark and returned changed. Jung reads the figure differently by sex; this companion, following the post-Jungian revision, offers it to anyone as the image of being open before one is formed, and of what that openness costs.</p>`,
  appears: `<p>In stories: Persephone; the princess in the tower; the apprentice; the newcomer. In life: the early years of any vocation; the person who takes the colour of the room; being chosen rather than choosing; the season after a loss in which one is remade. In dreams: the young woman who is a stranger, the girl in danger, the bride.</p>`,
  later: `<p>The sex-specific reading (anima for men, supraordinate personality for women) has been revised along with the rest of the anima/animus theory (see “The inner other”). Feminist Jungians (Douglas 1990; Young-Eisendrath) have re-read the Persephone material as a story of women’s development rather than of men’s anima.</p>`,
  prompts: [
    { id: 'f-maiden-1', q: 'Where are you still open — able to be moved and changed by what you meet? Where has that openness become a way of not choosing?' },
    { id: 'f-maiden-2', q: 'Persephone is taken and returns changed. What took you, once, without your consent, and what did you bring back?' },
    { id: 'f-maiden-3', q: 'When did you last say no? If you cannot remember, what is the openness protecting?' }
  ],
  other: `<p>Openness may simply be youth, or the right posture for learning; the cost only appears when the person could have said no and did not. Jung’s account leans on his gendered theory and on a reading of a specific Greek cult; treat the image as an image.</p>`,
  sources: [
    { label: 'jung', text: 'Jung, C. G. “The Psychological Aspects of the Kore” (1941), CW 9i §306–383; also in Jung &amp; Kerényi, <em>Introduction to a Science of Mythology</em> (1951 UK ed.).' },
    { label: 'later', text: 'Douglas, C. <em>The Woman in the Mirror</em> (1990). Young-Eisendrath, P. <em>Gender and Desire: Uncursing Pandora</em> (1997).' }
  ] },

{ id: 'hero', name: 'The hero', epithet: 'the one who goes out and does the thing', origin: 'jung',
  originNote: 'Jung’s figure: <em>Symbols of Transformation</em> (1912/1952), CW 5, Part II; “The Psychology of the Child Archetype”, CW 9i §284; later systematised by Neumann.',
  video: { url: '', title: 'The hero and the ego' },
  jung: `<p>“The hero’s main feat is to overcome the monster of darkness: it is the long-hoped-for and expected triumph of consciousness over the unconscious” (CW 9i §284°). In <em>Symbols of Transformation</em> the hero is the “finest symbol of the libido”, the psychic life-force that “personifies itself in figures of heroes with solar attributes” (IAAP abstract of CW 5, Part II), and the hero’s death and rebirth picture “the struggle of the self against the attraction of returning to the unconscious (mother)”. “The hero myth is an unconscious drama seen only in projection, like the happenings in Plato’s parable of the cave” (CW 5 §612°); “only one who has risked the fight with the dragon and is not overcome by it wins the hoard, the ‘treasure hard to attain’” (CW 14 §756°).</p>`,
  image: `<p>The ego’s own myth: separation, departure, the fight, the return with something won. As an image it asks whether you meet difficulty by facing it — and whether you have come to feel that you must be the one who does the facing, everywhere, always. Jung’s word for the second condition is inflation: the ego wearing an archetype’s clothes.</p>`,
  appears: `<p>In stories: Gilgamesh, Heracles, Siegfried, the dragon-slayer of every fairy tale, the lone protagonist of most films. In life: the person to whom it falls to put things right; the one who measures a year by what they got through; the founder, the rescuer, the fixer. In dreams: fights, monsters, journeys, the treasure that is hard to reach.</p>`,
  later: `<p>Erich Neumann (<em>The Origins and History of Consciousness</em>, 1949) made the hero myth the developmental story of the ego — uroboros, Great Mother, separation of the world parents, the birth and deeds of the hero — a schema Jung praised and Fordham criticised as mythology retrojected onto infancy. Joseph Campbell’s <em>The Hero with a Thousand Faces</em> (1949) is the popular monomyth, not a Jungian text. Hillman read the heroic ego as the thing psychology needed to relativise. Beebe uses “hero/heroine” as the archetype carrying a person’s strongest function.</p>`,
  prompts: [
    { id: 'f-hero-1', q: 'What, in the last year, did you treat as a dragon? Which of those things needed facing, and which needed listening to — or leaving alone?' },
    { id: 'f-hero-2', q: 'When did you last let someone else be the one who put it right? What did it cost you to stand aside?' },
    { id: 'f-hero-3', q: 'The hero returns. What have you brought back from a hard time that others can actually use — and what have you kept as a trophy?' }
  ],
  other: `<p>Facing things is often exactly right, and the heroic reading is not a criticism of courage. Its costs — rest read as idleness, people recast as obstacles — are questions to test, not findings. The hero of the myths is also mostly a young man; the image travels, but its stories carry that history.</p>`,
  sources: [
    { label: 'jung', text: 'Jung, C. G. <em>Symbols of Transformation</em>, CW 5, Part II: “The Origin of the Hero” (pp. 171–206 of the 2nd edition), “The Battle for Deliverance from the Mother” (pp. 274–305), “The Dual Mother” (pp. 306–393; §611–612°). “The Psychology of the Child Archetype”, CW 9i §284°. <em>Mysterium Coniunctionis</em>, CW 14 §756°.' },
    { label: 'later', text: 'Neumann, E. <em>The Origins and History of Consciousness</em> (1949; Eng. 1954). Campbell, J. <em>The Hero with a Thousand Faces</em> (1949). Hillman, J. <em>Re-Visioning Psychology</em> (1975). Beebe, J. <em>Energies and Patterns in Psychological Type</em> (2016).' }
  ] },

{ id: 'spirit', name: 'The wise old man', epithet: 'the archetype of meaning', origin: 'jung',
  originNote: 'Jung’s figure: “Archetypes of the Collective Unconscious”, CW 9i §66–79; “The Phenomenology of the Spirit in Fairytales” (1945/48), CW 9i §384–455.',
  video: { url: '', title: 'The spirit in fairy tales' },
  jung: `<p>“This is the archetype of meaning, just as the anima is the archetype of life itself” (CW 9i §66); “I have been content to call it the archetype of the wise old man, or of meaning. Modern man, in experiencing this archetype, comes to know that most ancient form of thinking as an autonomous activity whose object he is” (§79). “The wise old man appears in dreams in the guise of a magician, doctor, priest, teacher, professor, grandfather, or any person possessing authority” (§398°), and “can appear so plastically … that it takes over the role of a guru” (§398°). The figure “has a positive and a negative aspect” like all archetypes (§80). Its danger is the one Jung called the mana-personality: “being possessed by an archetype converts one into a mere collective figure, a kind of mask behind which the human element can no longer develop”; “not only does the danger lie in becoming oneself a father-mask, but also in the possibility of coming under the power of this mask when worn by another. Master and pupil are in this sense the same” (Baynes 1928, ch. “The Mana-Personality” ≈ CW 7 §374–406).</p>`,
  image: `<p>Counsel that arrives from somewhere older than oneself: the figure who knows how it is done, what deserves to last, where a thing has drifted. Jung meets it as an image of meaning that thinks “as an autonomous activity whose object he is”. Worn as an identity it becomes the guru, the father-mask — and Jung is as worried about the disciple as about the master.</p>`,
  appears: `<p>In stories: Merlin, the hermit, the old woman in the wood who gives the right advice, the teacher. In life: the institutional memory; the person others come to for the standard; the mentor, the elder — and, in its shadow, the one who meets every proposal with “we tried that”. In dreams: the old man or woman who speaks; a professor; a doctor; a voice of authority.</p>`,
  later: `<p>James Hillman’s “Senex and Puer” (1967) made the old man Saturnian — order, time, dryness, depression — and paired him permanently with the eternal youth (see that figure). Beebe assigns a “senex/witch” role to a critical, shadow position in his model. The IAAP abstract of Jung’s fairy-tale essay stresses the figure’s animal and ambiguous forms; the gender of “old man” is Jung’s; the image of the wise old woman is as old.</p>`,
  prompts: [
    { id: 'f-spirit-1', q: 'Who has been the wise old man or woman in your life — and when did their counsel become a mask you were expected to wear, or they were?' },
    { id: 'f-spirit-2', q: 'Where are you now the one who carries the standard? When does your standard preserve something, and when has familiarity begun to pass for truth?' },
    { id: 'f-spirit-3', q: 'Jung says master and pupil are “in this sense the same”. Which teacher, book or channel do you follow in a way that spares you having ideas of your own?' }
  ],
  other: `<p>Experience is real and elders are often right. The mana-personality is a danger of possession, not a verdict on anyone with authority; and the disciple’s danger — “spiritual laziness becomes a virtue” — applies to enthusiasm for Jung as much as for anyone.</p>`,
  sources: [
    { label: 'jung', text: 'Jung, C. G. “Archetypes of the Collective Unconscious”, CW 9i §66–80; “The Phenomenology of the Spirit in Fairytales” (1945/48), CW 9i §384–455 (§398°). <em>Two Essays</em>, CW 7, “The Mana-Personality” §374–406 (Baynes 1928 text).' },
    { label: 'later', text: 'Hillman, J. “Senex and Puer” (1967), in <em>Senex and Puer</em>, Uniform Edition vol. 3 (Spring, 2005). Beebe, J. “Evolving the Eight-Function Model” (2005).' }
  ] },

{ id: 'trickster', name: 'The trickster', epithet: 'the one who won’t let it stay solemn', origin: 'jung',
  originNote: 'Jung’s figure: “On the Psychology of the Trickster-Figure” (1954), CW 9i §456–488.',
  video: { url: '', title: 'The trickster' },
  jung: `<p>The trickster is “a forerunner of the savior … both subhuman and superhuman” (CW 9i §472°); “his chief and most alarming characteristic is his unconsciousness” (§472°). “The civilized man has forgotten the trickster … only figuratively and metaphorically”; “his own hidden shadow has qualities whose dangerousness exceeds his wildest dreams” (§478°). Jung reads the figure as a collective shadow — the official abstract calls it a “faithful representation of the absolutely undifferentiated human psyche” — and notes that “the shadow is mobilized when people get together in masses” (§ not verified).</p>`,
  image: `<p>The boundary-crosser: the one who finds where the give is in a rule, punctures what has become pompous, and cannot be trusted, including by himself. Jung’s trickster is older and stranger than a joker; it is the psyche before it was divided into up and down. As an image it asks what a puncture makes possible and what it makes harder to repair.</p>`,
  appears: `<p>In stories: Hermes, Loki, Coyote, Anansi, Reynard, the fool at court. In life: the one who breaks the tension in a room — sometimes because it needed breaking and sometimes because they could not bear it; the sabotage of one’s own position because holding one earnestly is unbearable; humour as reflex. In dreams: animals that talk, thieves, clowns, shape-changers, the figure who does the forbidden thing.</p>`,
  later: `<p>Paul Radin’s <em>The Trickster</em> (1956), for which Jung wrote his essay, and Karl Kerényi’s commentary are the sources; Hillman’s archetypal psychology took the trickster as a model of the psyche’s “seeing through”; Beebe gives “trickster” a specific shadow position in his type model; Lewis Hyde’s <em>Trickster Makes This World</em> (1998) is the fullest modern account and is not Jungian.</p>`,
  prompts: [
    { id: 'f-trickster-1', q: 'When did you last puncture something solemn? What became possible afterwards, and what became harder to say?' },
    { id: 'f-trickster-2', q: 'Where do you undercut your own position — with a joke, a shrug, a change of subject — at exactly the moment it was about to matter?' },
    { id: 'f-trickster-3', q: 'Jung says the trickster’s alarming feature is unconsciousness: it does not know what it is doing. Is there mischief you make that you only recognise afterwards?' }
  ],
  other: `<p>Irreverence is frequently the sanest response available. The trickster’s cost — reflex over judgment — is a question about timing, not about humour. And Jung’s trickster essay is about a Native American myth cycle read through a European lens; the image should not be confused with the cultures it was borrowed from.</p>`,
  sources: [
    { label: 'jung', text: 'Jung, C. G. “On the Psychology of the Trickster-Figure” (1954), CW 9i §456–488 (§472°, §478°).' },
    { label: 'later', text: 'Radin, P. <em>The Trickster: A Study in American Indian Mythology</em> (1956), with commentaries by Kerényi and Jung. Hyde, L. <em>Trickster Makes This World</em> (1998). Beebe, J. “Evolving the Eight-Function Model” (2005).' }
  ] },

{ id: 'mandala', name: 'The Self as mandala', epithet: 'centre and circumference', origin: 'jung',
  originNote: 'Jung’s figure: <em>Aion</em>, CW 9ii ch. IV; “Concerning Mandala Symbolism” (1950), CW 9i §627–712; “A Study in the Process of Individuation” (1934/50), CW 9i §525–626.',
  video: { url: '', title: 'Mandalas and the Self' },
  jung: `<p>“The self is not only the centre, but also the whole circumference which embraces both conscious and unconscious” (CW 12 §44°). Wholeness “is nevertheless empirical in so far as it is anticipated by the psyche in the form of spontaneous or autonomous symbols. These are the quaternity or mandala symbols, which occur not only in the dreams of modern people who have never heard of them, but are widely disseminated in the historical records of many peoples and many epochs” (CW 9ii ch. IV ≈ §59). “The mandala at first comes into the conscious mind as an unimpressive point or dot, and a great deal of hard and painstaking work as well as the integration of many projections are generally required before the full range of the symbol can be anything like completely understood” (≈ §60). “Symbols of the process of individuation are images, usually of archetypal nature, that appear in dreams and portray the centralizing process, or the production of a new centre of the personality” (Dell 1940, p. 96 = the 1936 text of CW 12). In therapy, mandalas are produced “in states of chaos or panic” (IAAP abstract, CW 9i §627–712); Jung noted that although the theme should in theory “befall every one”, “in practice it is met with in relatively few cases in a distinct form” (Dell 1940, p. 194).</p>`,
  image: `<p>A circle with a centre, drawn or dreamed when things have come apart: Jung’s image for the psyche’s own attempt at order. It is the ground pattern behind this companion’s pages, and it is offered as exactly what Jung said it was — a symbol that arrives on its own, from the psyche, in difficulty — and not as a reward for reflection.</p>`,
  appears: `<p>In art and religion: the rose window, the Tibetan mandala, the labyrinth, the four rivers of paradise, the cross in the circle. In life: the impulse to order a room, a garden, a page when the rest is chaos; the wish for a centre. In dreams: circles, squares, fourfold arrangements, a city seen from above, a clock, a flower.</p>`,
  later: `<p>Jung’s spontaneous mandala became, after him, a drawing exercise, a colouring book and a therapy technique — each a legitimate use, none of them what he described. Edinger (1972) made the ego–Self relation a diagram; Hillman refused the centre altogether. Roesler (2023) argues that of Jung’s archetype theory only “a universal process of psychological transformation” should be kept — of which the mandala was Jung’s chief evidence.</p>`,
  prompts: [
    { id: 'f-mandala-1', q: 'When your life last came apart, what did you find yourself ordering — a room, a routine, a page, a list? Describe the order you made and what it held.' },
    { id: 'f-mandala-2', q: 'Jung’s image comes “as an unimpressive point or dot”. What small, unimpressive thing have you kept returning to without knowing why?' },
    { id: 'f-mandala-3', q: 'If you drew a circle with a centre right now, what would be at the centre? And what is at the edge, only just inside?' }
  ],
  other: `<p>Drawing circles does not produce wholeness, and Jung did not say it did. A love of symmetry is a taste; a spontaneous image in a crisis is what he was describing. Readers who never meet such images are not thereby less whole — Jung said distinct forms of it are rare.</p>`,
  sources: [
    { label: 'jung', text: 'Jung, C. G. <em>Aion</em>, CW 9ii ch. IV “The Self” §43–67. “Concerning Mandala Symbolism” (1950), CW 9i §627–712; Appendix “Mandalas” (1955), CW 9i (§715°). “A Study in the Process of Individuation” (1934/50), CW 9i §525–626. <em>Psychology and Alchemy</em>, CW 12 §44°; 1936 text in Dell (trans.), <em>The Integration of the Personality</em> (1940).' },
    { label: 'later', text: 'Edinger, E. F. <em>Ego and Archetype</em> (1972). Hillman, J. <em>Archetypal Psychology</em> (1983). Roesler, C. <em>Deconstructing Archetype Theory</em> (Routledge, 2023).' }
  ] },

{ id: 'shadow-figure', name: 'The shadow', epithet: 'the meeting with oneself', origin: 'jung', link: 'shadow',
  originNote: 'Jung’s figure: <em>Aion</em>, CW 9ii ch. II; CW 9i §43–45. Its full treatment is the exercise “What gets under your skin”.',
  video: { url: '', title: 'The shadow' },
  jung: `<p>“The meeting with oneself is, at first, the meeting with one’s own shadow. The shadow is a tight passage, a narrow door” (CW 9i §45). “The shadow is a living part of the personality and therefore wants to live with it in some form. It cannot be argued out of existence or rationalized into harmlessness” (§44). It “personifies everything that the subject refuses to acknowledge about himself and yet is always thrusting itself upon him directly or indirectly” (CW 9i §513) — and it “also displays a number of good qualities” (CW 9ii §423).</p>`,
  image: `<p>The figure of everything the persona could not use, met first in others and last in oneself. Treated here as an image; worked through as an exercise.</p>`,
  appears: `<p>In stories: the double, the twin, Mr Hyde, the dark brother, the companion who betrays. In life: the person who gets under your skin; the traits you deny most confidently. In dreams: a same-sex figure you dislike, pursue or are pursued by; the intruder; the stranger in your house.</p>`,
  later: `<p>See the exercise. Fanny Brewster’s work on the racial freight of “dark” and “shadow” in Jungian language is the reason this companion keeps the figure moral and personal rather than visual.</p>`,
  prompts: [
    { id: 'f-shadow-1', q: 'Which figure in a story — book, film, myth — have you disliked out of all proportion? What does that figure do that you would never let yourself do?' }
  ],
  other: `<p>The exercise “What gets under your skin” carries the full set of exceptions: dislike is not projection, harm is harm, and some people are exactly as they seem.</p>`,
  sources: [
    { label: 'jung', text: 'Jung, C. G. <em>Aion</em>, CW 9ii §13–19, §423. <em>The Archetypes and the Collective Unconscious</em>, CW 9i §43–45, §513.' },
    { label: 'later', text: 'Brewster, F. <em>African Americans and Jungian Psychology: Leaving the Shadows</em> (2017).' }
  ] },

{ id: 'other-figure', name: 'The inner other', epithet: 'anima and animus, revised', origin: 'later', link: 'inner-other',
  originNote: 'Jung’s figures (CW 7; <em>Aion</em> ch. III), in the sex-neutral form proposed by Hillman, Samuels, Young-Eisendrath and Kast. Its full treatment is the exercise “The inner other”.',
  video: { url: '', title: 'Anima and animus' },
  jung: `<p>The anima “is not an invention of the conscious, but a spontaneous product of the unconscious” (CW 9ii §26), the “projection-making factor” (§20); “the anima is the archetype of life itself” (CW 9i §66). Jung assigned the anima to men and the animus to women, and described them asymmetrically — “men … irrational moods and women irrational opinions” (CW 9ii §35). The exercise gives the passages in full.</p>`,
  image: `<p>The figure one falls for and fights: the inner other who carries what one’s outward self excludes, and who is met first in other people. In this companion the figure belongs to anyone.</p>`,
  appears: `<p>In stories: the beloved who is a stranger, the muse, the femme fatale, the knight, the tempter, the guide in the underworld. In life: fascinations and aversions out of proportion; moods without a cause; opinions held past belief. In dreams: the unknown lover; the figure of the other sex who leads, seduces or judges.</p>`,
  later: `<p>Hillman (1985), Samuels (1989), Young-Eisendrath (1987–1997), Kast (2006), McKenzie (2006): see the exercise.</p>`,
  prompts: [
    { id: 'f-other-1', q: 'Which fictional figure have you been drawn to in a way that embarrassed you? What did they have that you do not allow yourself?' }
  ],
  other: `<p>Nothing about your sex, gender or orientation is assumed. Jung’s own formulation is quoted and labelled in the exercise.</p>`,
  sources: [
    { label: 'jung', text: 'Jung, C. G. <em>Aion</em>, CW 9ii ch. III §20–42. <em>Two Essays</em>, CW 7 §296–340.' },
    { label: 'later', text: 'Hillman, J. <em>Anima</em> (1985). Samuels, A. <em>The Plural Psyche</em> (1989). Young-Eisendrath, P. <em>Gender and Desire</em> (1997). Kast, V. “Anima/animus” (2006).' }
  ] },

{ id: 'puer-senex', name: 'Puer and senex', epithet: 'the one who hasn’t landed, and the one who knows how it is done', origin: 'later',
  originNote: 'A later development. Jung wrote of the “eternal child” (CW 9i §300°) and the wise old man; the puer–senex pairing as two poles of one personality pattern is Marie-Louise von Franz’s (lectures 1959–60) and James Hillman’s (1967).',
  video: { url: '', title: 'Puer aeternus and senex' },
  jung: `<p>Jung: “The ‘eternal child’ in man is an indescribable experience, an incongruity, a handicap, and a divine prerogative; an imponderable that determines the ultimate worth or worthlessness of a personality” (CW 9i §300°). On the son’s task: “the world makes demands on the masculinity of a man, on his ardour, above all on his courage and resolution … For this he would need a faithless Eros, one capable of forgetting his mother” (CW 9ii §22°). The senex as a figure is not Jung’s term; his old man is the archetype of meaning (see “The wise old man”).</p>`,
  image: `<p>Two poles that call each other into being. The puer: freshness, flight, the option not yet taken more alive than the one in hand, and “the strange attitude and feeling that one is not yet in real life” — the “provisional life”, a phrase von Franz credits to H. G. Baynes (1970, p. 8). The senex: order, standard, long memory, gravity — and dryness. Hillman’s point was that neither is the cure for the other.</p>`,
  appears: `<p>In stories: Icarus, Peter Pan, the Little Prince (von Franz’s example), Saturn and Kronos, the old king who will not die. In life: the person “very good at the first six months of anything”; the accumulation of beginnings; and, at the other pole, the brake, the institutional memory, the one who says what the standard is. In dreams: flying, falling, the boy who will not grow up; the old man in the cold house.</p>`,
  later: `<p>Von Franz: “the one thing dreaded throughout by such a type of man is to be bound to anything whatever”; “every just-so situation is hell”; “there is always a ‘but’ which prevents marriage or any kind of definite commitment”; and the cure — “if a man pulls out of this kind of youthful neurosis, then it is through work. But work is the one disagreeable word which no puer aeternus likes to hear” (1970, pp. 8–10). Her lectures also contain a 1959 view attributing homosexuality to the mother-complex, which this companion does not reproduce and which the field has abandoned. Hillman, “Senex and Puer” (1967): the two are one archetype seen from its ends; a psychology that only wants to mature the puer loses what the puer carries. Critics have turned the concept on its authors: Douglas (1998) on Jung, Tacey (2014) on Hillman.</p>`,
  prompts: [
    { id: 'f-puer-1', q: 'Is there a part of your life that still feels as though it hasn’t started? What is it waiting for — and what would be lost the day it began?' },
    { id: 'f-puer-2', q: 'Von Franz’s cure is work: ordinary, finite, done to the end. What have you finished lately that nobody asked for? What have you abandoned at the first “but”?' },
    { id: 'f-puer-3', q: 'Where are you the senex — the standard, the memory, the brake? When did that last preserve something worth preserving, and when was it only gravity?' }
  ],
  other: `<p>Keeping options open is sometimes wisdom, and commitment is not a virtue in itself. Von Franz’s portrait is of a “young man with an outstanding mother complex” in 1959 Zurich; the image travels further than the diagnosis. A life of many beginnings can also be a life of many gifts, which is Hillman’s objection to curing it.</p>`,
  sources: [
    { label: 'jung', text: 'Jung, C. G. “The Psychology of the Child Archetype”, CW 9i §300°. <em>Aion</em>, CW 9ii §22°.' },
    { label: 'later', text: 'von Franz, M.-L. <em>The Problem of the Puer Aeternus</em> (lectures 1959–60; 3rd ed. Inner City, 2000), pp. 7–10. Hillman, J. “Senex and Puer” (Eranos 1967), in <em>Senex and Puer</em>, Uniform Edition vol. 3 (Spring, 2005). Douglas, C. “Hexagram 4 of the I Ching”, <em>Journal of Analytical Psychology</em> 43 (1998). Tacey, D. “James Hillman: the unmaking of a psychologist”, <em>Journal of Analytical Psychology</em> 59 (2014).' }
  ] },

{ id: 'healer', name: 'The wounded healer', epithet: 'the one whose injury is the instrument', origin: 'later',
  originNote: 'Jung’s image — “the Greek myth of the wounded physician” (CW 16 §239°) — made into a named, split archetype by Adolf Guggenbühl-Craig (1971).',
  video: { url: '', title: 'The wounded healer' },
  jung: `<p>“The analyst must go on learning endlessly … it is his own hurt that gives the measure of his power to heal. This, and nothing else, is the meaning of the Greek myth of the wounded physician”; “a good half of every treatment that probes at all deeply consists in the doctor’s examining himself” (CW 16 §239°, “Fundamental Questions of Psychotherapy”, 1951). In the memoir: “The doctor is effective only when he himself is affected. ‘Only the wounded physician heals.’ But when the doctor wears his personality like a coat of armour, he has no effect”; “it often happens that the patient is exactly the right plaster for the doctor’s sore spot” (<em>Memories, Dreams, Reflections</em>, “Psychiatric Activities”; the aphorism is printed in quotation marks as a saying).</p>`,
  image: `<p>Understanding that grew through difficulty, and the risk that comes with it. The helper whose own wound is the instrument can listen as no one else can — and can also arrange things so that all the wound sits in the other person and all the health in themselves. Guggenbühl-Craig’s contribution was to name that split.</p>`,
  appears: `<p>In myth: Chiron, the centaur who teaches healing and cannot heal himself; Asclepius. In life: the person things get brought to; the helper who is far more comfortable helping than being helped; the professions of care. In dreams: doctors, nurses, hospitals, wounds that do not close.</p>`,
  later: `<p>Guggenbühl-Craig, <em>Power in the Helping Professions</em> (1971): the healer–patient archetype is bipolar and can be split, the analyst identifying with the healer pole and projecting the wounded pole onto the patient, who then loses touch with an inner healer of their own; the power shadow of helping (not read for this companion; summarised as generally reported). Zerubavel and Wright (2012) review the idea for clinicians and note that “Jung was the first psychotherapist to reference the archetype of the wounded healer”.</p>`,
  prompts: [
    { id: 'f-healer-1', q: 'What do you understand about people because you went through it yourself? Where does that understanding help you listen, and where does it make you assume the other person’s story is yours?' },
    { id: 'f-healer-2', q: 'When were you last helped — properly, in a way you could not have managed alone? If you cannot remember, what is the role protecting?' },
    { id: 'f-healer-3', q: 'Guggenbühl-Craig’s split: is there anyone whose recovery would leave you without a purpose? Say who, and what you would do the day after.' }
  ],
  other: `<p>Suffering confers neither wisdom nor the ability to heal, and Jung’s sentence is about analysts examining themselves, not about wounds as credentials. Helping is often simply good. The split is a question to put to a role, not a diagnosis of anyone who helps.</p>`,
  sources: [
    { label: 'jung', text: 'Jung, C. G. “Fundamental Questions of Psychotherapy” (1951), CW 16 §239°. <em>Memories, Dreams, Reflections</em> (1963), “Psychiatric Activities”.' },
    { label: 'later', text: 'Guggenbühl-Craig, A. <em>Power in the Helping Professions</em> (Spring, 1971). Kerényi, K. <em>Asklepios: Archetypal Image of the Physician’s Existence</em> (Bollingen, 1959). Zerubavel, N. &amp; Wright, M. O. “The dilemma of the wounded healer”, <em>Psychotherapy</em> 49 (2012).' }
  ] },

{ id: 'creator', name: 'The creative daimon', epithet: 'the one the work uses', origin: 'project',
  originNote: 'This project’s label for an image in Jung’s essays on art and the creative process (CW 15). Those essays could not be verified line by line for this companion; the summary below is this project’s, and no sentence is quoted as Jung’s.',
  video: { url: '', title: 'Jung on the creative process' },
  jung: `<p>In “Psychology and Literature” (1930/50) and “On the Relation of Analytical Psychology to Poetry” (1922), Jung describes a kind of creative work that seems to have hold of its maker — an “autonomous complex” that draws energy from the rest of a life and pursues its own ends, so that (in the familiar paraphrase) it is the work that creates the artist rather than the reverse. The claim is about certain works and certain makers, not about creativity in general, and Jung is unusually cold about its cost to “an ordinary human life”. <em>The passages have not been checked against the Collected Works for this companion; treat this paragraph as a summary and consult CW 15 §97–162 directly.</em></p>`,
  image: `<p>Making that feels chosen and insistent at once: the work that would be done unpaid and unseen, and that takes its energy from somewhere. The image gives language to that experience; it does not establish that the material has intentions of its own.</p>`,
  appears: `<p>In stories: Prometheus; Faust, in Jung’s own favourite example; the artist who is consumed. In life: the project everything else waits for; the notebook nobody sees; the audience that becomes part of the compulsion. In dreams: workshops, unfinished buildings, a thing that grows on its own.</p>`,
  later: `<p>Hillman’s “acorn theory” (<em>The Soul’s Code</em>, 1996) is a popular cousin — an innate image that calls a life — and is Hillman’s, not Jung’s. Otto Rank and, later, the psychology of creativity treat the same phenomena without an autonomous complex.</p>`,
  prompts: [
    { id: 'f-creator-1', q: 'What work would you do whether or not anyone ever saw it? Does it feel chosen, insistent, or both — and who, in the room, gets what is left over?' },
    { id: 'f-creator-2', q: 'Jung’s cold observation is that the work gets fed first. Name one thing the work has taken and one thing it has given back to the people around you.' }
  ],
  other: `<p>Most creative work is neither daemonic nor costly and needs no myth. The image fits some makers and flatters others; the second prompt exists to tell them apart.</p>`,
  sources: [
    { label: 'jung', text: 'Jung, C. G. “On the Relation of Analytical Psychology to Poetry” (1922) and “Psychology and Literature” (1930/50), CW 15 §97–162 — not verified for this companion.' },
    { label: 'later', text: 'Hillman, J. <em>The Soul’s Code</em> (1996).' }
  ] }
];


/* ============================================================
   The Structure of the Psyche — A Jungian Reflection Companion
   engine.js · state, local storage, routing, guide assembly,
   export/import, theme, mandala ground. Logic only; no copy.
   ============================================================ */

/* ---------- mandala ground (unchanged from the inventory) ---------- */
(function ground(){
  const build=()=>{
    const NS='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(NS,'svg'); svg.setAttribute('viewBox','-200 -200 400 400');
    const g=document.createElementNS(NS,'g'); g.setAttribute('fill','none'); g.setAttribute('stroke','currentColor'); g.setAttribute('stroke-width','.4');
    const mk=(t,at)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);return e;};
    [188,170,132,124,86,58,30,12].forEach((r,i)=>g.appendChild(mk('circle',{cx:0,cy:0,r,opacity:.55-i*.03})));
    for(let i=0;i<72;i++){const a=i*5*Math.PI/180,l=(i%6===0)?18:9;
      g.appendChild(mk('line',{x1:Math.cos(a)*170,y1:Math.sin(a)*170,x2:Math.cos(a)*(170+l),y2:Math.sin(a)*(170+l),opacity:.4}));}
    for(let i=0;i<16;i++){const a=i*22.5*Math.PI/180;
      g.appendChild(mk('line',{x1:Math.cos(a)*30,y1:Math.sin(a)*30,x2:Math.cos(a)*124,y2:Math.sin(a)*124,opacity:.28}));}
    const sq=r=>`${-r},${-r} ${r},${-r} ${r},${r} ${-r},${r}`;
    g.appendChild(mk('polygon',{points:sq(87.7),opacity:.42}));
    g.appendChild(mk('polygon',{points:sq(87.7),transform:'rotate(45)',opacity:.42}));
    const gb=document.createElementNS(NS,'g'); gb.setAttribute('class','ring-b'); gb.setAttribute('fill','none'); gb.setAttribute('stroke','currentColor'); gb.setAttribute('stroke-width','.4');
    for(let i=0;i<12;i++) gb.appendChild(mk('ellipse',{cx:0,cy:-30,rx:11,ry:29,transform:`rotate(${i*30})`,opacity:.34}));
    for(let i=0;i<24;i++){const a=i*15*Math.PI/180; gb.appendChild(mk('circle',{cx:Math.cos(a)*148,cy:Math.sin(a)*148,r:3.2,opacity:.3}));}
    svg.appendChild(g); svg.appendChild(gb);
    const host=document.getElementById('ground'); host.style.color='var(--brass)'; host.appendChild(svg);
  };
  (window.requestIdleCallback||(f=>setTimeout(f,1)))(build);
})();

/* ---------- theme ---------- */
(function theme(){
  const b=document.getElementById('theme'), ic=document.getElementById('themeIcon');
  const moon='M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z';
  const sun='M12 4V2M12 22v-2M4 12H2M22 12h-2M5.6 5.6L4.2 4.2M19.8 19.8l-1.4-1.4M5.6 18.4l-1.4 1.4M19.8 4.2l-1.4 1.4M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0z';
  const root=document.documentElement;
  const effective=()=> root.getAttribute('data-theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light':'dark');
  const paint=()=> ic.setAttribute('d', effective()==='dark' ? moon : sun);
  b.onclick=()=>{ const next=effective()==='dark'?'light':'dark'; root.setAttribute('data-theme',next); paint(); try{ localStorage.setItem(META.storageKey+':theme',next); }catch(e){} };
  try{ const saved=localStorage.getItem(META.storageKey+':theme'); if(saved) root.setAttribute('data-theme',saved); }catch(e){}
  if(window.matchMedia) try{ matchMedia('(prefers-color-scheme: light)').addEventListener('change', paint); }catch(e){}
  try{ new MutationObserver(paint).observe(root,{attributes:true,attributeFilter:['data-theme']}); }catch(e){}
  paint();
})();

/* ---------- utilities ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId=(arr,id)=>arr.find(x=>x.id===id);
const EX=id=>byId(EXERCISES,id);
const FIG=id=>byId(FIGURES,id);
const fmtWhen=iso=>{ try{ const d=new Date(iso); return d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}); }catch(e){ return iso; } };
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} ta.remove(); return ok; }
}
function say(msg, ms=2600){ const s=$('#status'); if(!s) return; s.textContent=msg; if(ms) setTimeout(()=>{ if(s.textContent===msg) s.textContent=''; },ms); }

/* ---------- state & storage (local only) ---------- */
const BLANK=()=>({ v:1, started:null, interests:[], exp:{}, dream:null, figs:[], entries:{}, visited:{} });
let S=BLANK();
let storageOK=true;
function load(){
  try{ const raw=localStorage.getItem(META.storageKey); if(raw){ const d=JSON.parse(raw); if(d && d.v===1) S=Object.assign(BLANK(),d); } }
  catch(e){ storageOK=false; }
}
let saveTimer=null;
function save(quiet){
  try{ localStorage.setItem(META.storageKey, JSON.stringify(S)); storageOK=true; if(!quiet) say('Saved locally'); }
  catch(e){ storageOK=false; say('Could not save — this browser is blocking local storage', 5000); }
}
function saveSoon(){ if(saveTimer) clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ saveTimer=null; save(); },450); }
function setEntry(id,text){
  if(!text.trim()){ delete S.entries[id]; } else { S.entries[id]={ t:text, u:new Date().toISOString() }; }
  saveSoon();
}
function entry(id){ return S.entries[id] ? S.entries[id].t : ''; }
function hasSelections(){ return S.interests.length>0 || Object.values(S.exp).some(v=>v==='yes') || S.figs.length>0 || !!S.dream; }
function resetAll(){ S=BLANK(); try{ localStorage.removeItem(META.storageKey); }catch(e){} }

/* prompt lookup: every prompt id → {q, owner, kind} */
const PROMPT_INDEX=(()=>{
  const m={};
  EXERCISES.forEach(ex=>ex.parts.forEach(p=>{ if(p.kind==='prompts') p.prompts.forEach(pr=>m[pr.id]={q:pr.q, owner:ex.id, kind:'exercise', name:ex.name}); }));
  FIGURES.forEach(f=>f.prompts.forEach(pr=>m[pr.id]={q:pr.q, owner:f.id, kind:'figure', name:f.name}));
  return m;
})();
function promptsOf(ex){ return ex.parts.filter(p=>p.kind==='prompts').flatMap(p=>p.prompts); }
function progressOf(ex){ const ps=promptsOf(ex); const done=ps.filter(p=>entry(p.id).trim()).length; return {done,total:ps.length}; }

/* ---------- export / import ---------- */
function exportJSON(){
  // Resolves to the message to show. The file is written by the browser
  // directly; when the page is hosted inside a viewer that blocks downloads a
  // page starts itself (claude.ai artifacts), the viewer is asked to offer the
  // file instead. Nothing leaves the reader's machine either way.
  const text=JSON.stringify({app:META.title, version:META.version, exported:new Date().toISOString(), data:S},null,1);
  const name='structure-of-the-psyche-notebook-'+new Date().toISOString().slice(0,10)+'.json';
  const direct=()=>{
    const blob=new Blob([text],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
    return 'Exported';
  };
  const hosted=window.claude && typeof window.claude.use==='function';
  if(!hosted) return Promise.resolve(direct());
  return window.claude.use('downloads').then(d=>{
    if(!d) return direct();
    return d.save({filename:name, data:text}).then(()=>'Exported', e=>(e&&e.code==='declined')?'Export cancelled':'Export is not available in this viewer — use Print everything instead');
  });
}
function importJSON(file, mode){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{ try{
      const d=JSON.parse(r.result); const data=d&&d.data&&d.data.v===1?d.data:(d&&d.v===1?d:null);
      if(!data) return rej(new Error('That file is not a notebook export from this companion.'));
      if(mode==='replace'){ S=Object.assign(BLANK(),data); }
      else { // merge: keep newer entries, union selections
        Object.entries(data.entries||{}).forEach(([k,v])=>{ if(!S.entries[k] || (v.u>S.entries[k].u)) S.entries[k]=v; });
        S.interests=[...new Set([...S.interests,...(data.interests||[])])];
        S.figs=[...new Set([...S.figs,...(data.figs||[])])];
        S.exp=Object.assign({},data.exp||{},S.exp);
        S.dream=S.dream||data.dream||null; S.started=S.started||data.started||null;
      }
      save(true); res(true);
    }catch(e){ rej(new Error('That file could not be read.')); } };
    r.onerror=()=>rej(new Error('That file could not be read.'));
    r.readAsText(file);
  });
}

/* ---------- guide link: selections only, never entries ---------- */
function guideLink(){
  const p=new URLSearchParams();
  if(S.interests.length) p.set('i',S.interests.join(','));
  const yes=Object.entries(S.exp).filter(([k,v])=>v==='yes').map(([k])=>k); if(yes.length) p.set('e',yes.join(','));
  const unsure=Object.entries(S.exp).filter(([k,v])=>v==='unsure').map(([k])=>k); if(unsure.length) p.set('u',unsure.join(','));
  if(S.dream) p.set('d',S.dream);
  if(S.figs.length) p.set('f',S.figs.join(','));
  const q=p.toString();
  return location.href.replace(/#.*$/,'')+'#/guide'+(q?'?'+q:'');
}
function applyGuideQuery(qs){
  const p=new URLSearchParams(qs); let changed=false;
  const ids=k=>(p.get(k)||'').split(',').filter(Boolean);
  const ii=ids('i').filter(id=>byId(INTERESTS,id)); if(ii.length){ S.interests=ii; changed=true; }
  const ee=ids('e').filter(id=>byId(EXPERIENCES,id)); const uu=ids('u').filter(id=>byId(EXPERIENCES,id));
  if(ee.length||uu.length){ S.exp={}; ee.forEach(id=>S.exp[id]='yes'); uu.forEach(id=>S.exp[id]='unsure'); changed=true; }
  const d=p.get('d'); if(d && byId(DREAM_RECALL,d)){ S.dream=d; changed=true; }
  const ff=ids('f').filter(id=>FIG(id)); if(ff.length){ S.figs=ff; changed=true; }
  if(changed){ if(!S.started) S.started=new Date().toISOString(); save(true); }
  return changed;
}

/* ---------- guide assembly: only from explicit selections ---------- */
function buildGuide(){
  const items=[]; const seen=new Set();
  const yes=EXPERIENCES.filter(e=>S.exp[e.id]==='yes');
  const unsure=EXPERIENCES.filter(e=>S.exp[e.id]==='unsure');
  const reasonsFor=id=>{
    const r=[];
    if(S.interests.includes(id)) r.push({kind:'chose', text:byId(INTERESTS,id).name});
    yes.filter(e=>e.links.includes(id)).forEach(e=>r.push({kind:'yes', text:e.text, id:e.id}));
    unsure.filter(e=>e.links.includes(id)).forEach(e=>r.push({kind:'unsure', text:e.text, id:e.id}));
    if(id==='dreams' && S.dream && S.dream!=='skip') r.push({kind:'dream', text:byId(DREAM_RECALL,S.dream).text});
    return r;
  };
  // 1. chosen interests, in the reader's order
  S.interests.forEach(id=>{ if(id==='figures'||seen.has(id)) return; const ex=EX(id); if(ex){ items.push({ex, reasons:reasonsFor(id), tier:'chosen'}); seen.add(id);} });
  // 2. exercises linked by experiences reported as true
  EXERCISES.forEach(ex=>{ if(seen.has(ex.id)) return; const r=reasonsFor(ex.id); if(r.some(x=>x.kind==='yes'||x.kind==='dream')){ items.push({ex, reasons:r, tier:'noted'}); seen.add(ex.id);} });
  // 3. exercises linked only by "unsure"
  EXERCISES.forEach(ex=>{ if(seen.has(ex.id)) return; const r=reasonsFor(ex.id); if(r.length){ items.push({ex, reasons:r, tier:'maybe'}); seen.add(ex.id);} });
  // 4. the rest
  const rest=EXERCISES.filter(ex=>!seen.has(ex.id));
  // figures: chosen explicitly, plus the gallery if "figures" was chosen or a figure-linked experience was noted
  const figIds=[...S.figs];
  const figReasons={}; figIds.forEach(id=>figReasons[id]=[{kind:'chose',text:FIG(id).name}]);
  const wantsGallery=S.interests.includes('figures') || yes.some(e=>e.links.includes('figures')) || unsure.some(e=>e.links.includes('figures'));
  const galleryReasons=[]; if(S.interests.includes('figures')) galleryReasons.push({kind:'chose',text:byId(INTERESTS,'figures').name});
  yes.filter(e=>e.links.includes('figures')).forEach(e=>galleryReasons.push({kind:'yes',text:e.text,id:e.id}));
  unsure.filter(e=>e.links.includes('figures')).forEach(e=>galleryReasons.push({kind:'unsure',text:e.text,id:e.id}));
  return {items, rest, figIds, figReasons, wantsGallery, galleryReasons, yes, unsure};
}

/* ---------- router ---------- */
const ROUTES=[
  { re:/^\/?$/,                    view:()=>viewWelcome() },
  { re:/^\/start$/,                view:()=>viewStart() },
  { re:/^\/guide(\?.*)?$/,         view:m=>viewGuide(m[1]) },
  { re:/^\/exercises$/,            view:()=>viewExercises() },
  { re:/^\/exercise\/([a-z-]+)$/,  view:m=>viewExercise(m[1]) },
  { re:/^\/figures$/,              view:()=>viewFigures() },
  { re:/^\/figure\/([a-z-]+)$/,    view:m=>viewFigure(m[1]) },
  { re:/^\/notebook$/,             view:()=>viewNotebook() },
  { re:/^\/print$/,                view:()=>viewPrint() },
  { re:/^\/about$/,                view:()=>viewAbout() },
  { re:/^\/sources$/,              view:()=>viewSources() }
];
function route(){
  const h=location.hash.replace(/^#/,'')||'/';
  for(const r of ROUTES){ const m=h.match(r.re); if(m){ return r.view(m); } }
  return viewNotFound(h);
}
function go(path){ location.hash='#'+path; }
function render(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; save(true); }
  const main=$('#main');
  main.innerHTML=route();
  paintNav();
  afterRender(main);
  const t=main.querySelector('[data-focus]')||main.querySelector('h1,h2');
  if(t){ if(!t.hasAttribute('tabindex')) t.setAttribute('tabindex','-1'); try{ t.focus({preventScroll:true}); }catch(e){ t.focus(); } }
  window.scrollTo({top:0,behavior:'auto'});
}
function paintNav(){
  const h=location.hash.replace(/^#/,'')||'/';
  const items=[['/start','Start'],['/guide','Your guide'],['/exercises','Exercises'],['/figures','Figures'],['/notebook','Notebook'],['/about','About']];
  $('#nav').innerHTML=items.map(([p,l])=>{
    const cur = (p==='/exercises' && /^\/exercise\//.test(h)) || (p==='/figures' && /^\/figure\//.test(h)) || h===p || (p==='/guide'&&h.startsWith('/guide'));
    return `<a href="#${p}"${cur?' aria-current="page"':''}>${l}</a>`; }).join('');
}
window.addEventListener('hashchange',render);
document.addEventListener('DOMContentLoaded',()=>{ load(); render(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden && saveTimer){ clearTimeout(saveTimer); saveTimer=null; save(true); } });
window.addEventListener('beforeprint',()=>{ document.querySelectorAll('.prompt').forEach(p=>{ const ta=p.querySelector('textarea'), pr=p.querySelector('.printed'); if(ta&&pr) pr.textContent=ta.value||'—'; }); });

  if(r.kind==='unsure') return `<p>You weren’t sure whether this is true of you: <span class="you">“${esc(r.text)}”</span></p>`;
  if(r.kind==='dream') return `<p>On dreams you said: <span class="you">“${esc(r.text)}”</span></p>`;
  return '';
}
function guideCard(ex, reasons, tier){
