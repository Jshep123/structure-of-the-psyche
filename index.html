<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="A Jungian reflection companion: eight exercises and a gallery of archetypal images, with Jung's own words, later developments, the evidence, and open-ended prompts. No scores, no type, nothing sent anywhere.">
<title>The Structure of the Psyche — A Jungian Reflection Companion</title>
<style>
/* ============================================================
   The Structure of the Psyche — A Jungian Reflection Companion
   styles.css · every style rule. Design tokens are at the top;
   the visual identity (serif, brass, mandala ground) is kept from
   the earlier inventory. Print is always light.
   ============================================================ */

/* ---------- tokens ---------- */
:root{
  color-scheme: dark;
  --plane:#0d0d0c;
  --surface:#1a1a19;
  --surface-2:#212120;
  --ink:#f2efe6;
  --ink-2:#a8a49a;
  --ink-3:#8b8880;   /* 5.5:1 on the plane */
  --hair:rgba(255,255,255,.09);
  --hair-2:rgba(255,255,255,.16);
  --brass:#c8a24a;
  --brass-dim:rgba(200,162,74,.14);
  --tag-jung:#c8a24a;
  --tag-later:#7fb2e0;
  --tag-research:#8fc49a;
  --tag-project:#d9a7c0;
  --col:34rem;
  --wide:46rem;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
/* Light palette: applied when the system is light and nothing is stamped,
   or when light is stamped explicitly. KEEP THE TWO BLOCKS IDENTICAL. */
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --plane:#f4f1e8; --surface:#fcfcfb; --surface-2:#f6f4ee;
    --ink:#131312; --ink-2:#52514e; --ink-3:#6b6962;
    --hair:rgba(11,11,11,.11); --hair-2:rgba(11,11,11,.2);
    --brass:#7a5d16; --brass-dim:rgba(138,106,28,.12);
    --tag-jung:#7a5d16; --tag-later:#2a5f95; --tag-research:#2f6b3c; --tag-project:#8a3d63;
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --plane:#f4f1e8; --surface:#fcfcfb; --surface-2:#f6f4ee;
  --ink:#131312; --ink-2:#52514e; --ink-3:#6b6962;
  --hair:rgba(11,11,11,.11); --hair-2:rgba(11,11,11,.2);
  --brass:#7a5d16; --brass-dim:rgba(138,106,28,.12);
  --tag-jung:#7a5d16; --tag-later:#2a5f95; --tag-research:#2f6b3c; --tag-project:#8a3d63;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  -webkit-tap-highlight-color:transparent;
  background:var(--plane); color:var(--ink);
  font-family:var(--serif); font-size:16px; line-height:1.62;
  -webkit-font-smoothing:antialiased; min-height:100vh; overflow-x:hidden;
}
.skip{position:absolute; left:-999px; top:8px; background:var(--brass); color:var(--plane); padding:8px 12px; border-radius:3px; z-index:50; font-family:var(--sans); font-size:13px}
.skip:focus{left:12px}

/* ---------- mandala ground ---------- */
#ground{position:fixed; inset:0; z-index:0; pointer-events:none; contain:strict; display:grid; place-items:center; overflow:hidden}
#ground svg{width:min(190vh,190vw); height:min(190vh,190vw); will-change:transform; opacity:.26; animation:turn 240s linear infinite}
#ground .ring-b{animation:turn-r 360s linear infinite; transform-origin:50% 50%; will-change:transform}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes turn-r{to{transform:rotate(-360deg)}}
#vignette{position:fixed; inset:0; z-index:1; pointer-events:none; contain:strict;
  background:radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0) 0%, var(--plane) 82%),
             linear-gradient(to bottom, var(--plane) 0%, rgba(0,0,0,0) 14% 86%, var(--plane) 100%)}
@media (prefers-reduced-motion:reduce){ #ground svg,#ground .ring-b{animation:none} }

/* ---------- shell & header ---------- */
.shell{position:relative; z-index:2; max-width:820px; margin:0 auto;
  padding:0 max(20px, env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left))}
header.bar{display:flex; align-items:center; gap:14px; padding:20px 0 12px; flex-wrap:wrap}
.mark{font-family:var(--sans); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap; text-decoration:none}
.mark:hover{color:var(--brass)}
.bar .spacer{flex:1}
.tbtn{appearance:none; background:transparent; border:1px solid var(--hair); color:var(--ink-2); border-radius:999px; width:42px; height:42px; cursor:pointer; display:grid; place-items:center; padding:0; transition:border-color .18s,color .18s}
.tbtn:hover{border-color:var(--hair-2); color:var(--ink)}
.tbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6}
nav.top{display:flex; gap:4px; overflow-x:auto; padding:6px 0 10px; border-bottom:1px solid var(--hair); margin-bottom:34px; scrollbar-width:none}
nav.top::-webkit-scrollbar{display:none}
nav.top a{font-family:var(--sans); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); text-decoration:none; padding:8px 10px; border-radius:3px; white-space:nowrap; min-height:36px; display:inline-flex; align-items:center}
nav.top a:hover{color:var(--ink); background:var(--surface)}
nav.top a[aria-current="page"]{color:var(--brass); background:var(--brass-dim)}
.status{font-family:var(--sans); font-size:11px; letter-spacing:.06em; color:var(--ink-3); min-height:1em}

:focus-visible{outline:2px solid var(--brass); outline-offset:3px; border-radius:3px}
[data-focus]:focus{outline:none}
@media (prefers-reduced-motion:reduce){ .screen{animation:none!important} .btn,.tbtn,.choice,.card{transition:none!important} }

/* ---------- typography ---------- */
h1{font-family:var(--serif); font-weight:400; font-size:clamp(32px,6vw,50px); line-height:1.12; letter-spacing:-.015em; margin:0 0 6px}
h1 em{font-style:italic; color:var(--brass)}
h2,h1.pg{font-family:var(--serif); font-weight:400; font-size:clamp(26px,4.6vw,36px); line-height:1.18; letter-spacing:-.012em; margin:0 0 14px}
h3,h2.sec{font-family:var(--serif); font-weight:400; font-size:22px; margin:0 0 12px; color:var(--ink); line-height:1.3; letter-spacing:0}
h4{font-family:var(--serif); font-weight:400; font-size:19px; margin:0 0 10px; color:var(--ink)}
.sub{font-family:var(--sans); font-size:12px; letter-spacing:.19em; text-transform:uppercase; color:var(--ink-3); margin:0 0 30px}
p{margin:0 0 16px; color:var(--ink-2)}
p.lede{color:var(--ink); font-size:18px; line-height:1.6}
.note{font-family:var(--serif); font-size:14px; line-height:1.66; color:var(--ink-3); margin:12px 0 0}
.kicker{font-family:var(--sans); font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--brass); margin:0 0 8px}
.num{font-family:var(--sans); font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--brass); margin:0 0 14px}
.rule-orn{display:flex; align-items:center; gap:14px; margin:34px 0; color:var(--ink-3)}
.rule-orn::before,.rule-orn::after{content:""; flex:1; height:1px; background:var(--hair)}
.rule-orn span{font-size:13px; letter-spacing:.3em}
hr.hair{height:1px; background:var(--hair); border:0; margin:30px 0}
a{color:var(--brass)}
blockquote{margin:0 0 20px; padding:0 0 0 18px; border-left:1px solid var(--brass); font-style:italic; color:var(--ink)}
blockquote cite{display:block; margin-top:8px; font-style:normal; font-family:var(--sans); font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--ink-3)}
dl.portraits dt{font-family:var(--serif); color:var(--ink); font-size:17px; margin:16px 0 4px}
dl.portraits dd{margin:0; color:var(--ink-2); font-size:15px}
.col{max-width:var(--col)}
.wide{max-width:var(--wide)}
.screen{animation:rise .45s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0; transform:translateY(12px)}to{opacity:1; transform:none}}

/* ---------- buttons ---------- */
.btn{appearance:none; font-family:var(--sans); font-size:14px; font-weight:500; letter-spacing:.03em; padding:12px 22px; border-radius:2px; cursor:pointer; border:1px solid var(--brass); background:var(--brass); color:var(--plane); transition:transform .16s, filter .16s; text-decoration:none; display:inline-flex; align-items:center; gap:8px; min-height:44px}
.btn:hover{filter:brightness(1.09); transform:translateY(-1px)}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--hair-2)}
.btn.ghost:hover{color:var(--ink); border-color:var(--brass); filter:none}
.btn.small{padding:8px 14px; font-size:12.5px; min-height:38px}
.btn:disabled{opacity:.35; cursor:not-allowed; transform:none}
.btnrow{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:26px}
.lnk{background:none; border:0; cursor:pointer; font-family:var(--sans); font-size:12.5px; color:var(--ink-3); padding:10px 0; min-height:40px; letter-spacing:.03em; border-bottom:1px solid transparent}
.lnk:hover{color:var(--brass); border-bottom-color:var(--brass)}
.said{font-family:var(--sans); font-size:12px; color:var(--brass); letter-spacing:.04em}

/* ---------- attribution tags ---------- */
.tag{display:inline-block; font-family:var(--sans); font-size:10px; letter-spacing:.18em; text-transform:uppercase; padding:3px 8px; border-radius:2px; border:1px solid currentColor; vertical-align:middle; line-height:1.4}
.tag.jung{color:var(--tag-jung)} .tag.later{color:var(--tag-later)} .tag.research{color:var(--tag-research)} .tag.project{color:var(--tag-project)}
.legend{display:grid; gap:10px; margin:24px 0}
.legend div{display:flex; gap:12px; align-items:flex-start; font-size:14.5px; color:var(--ink-2)}
.legend .tag{flex:none; margin-top:3px; min-width:96px; text-align:center}

/* ---------- start (intake) ---------- */
.choices{display:grid; gap:8px; margin:12px 0 26px}
.choice{display:flex; gap:14px; align-items:flex-start; background:var(--surface); border:1px solid var(--hair); border-radius:3px; padding:14px 16px; cursor:pointer; transition:border-color .18s,background .18s}
.choice:hover{border-color:var(--brass)}
.choice.on{border-color:var(--brass); background:var(--brass-dim)}
.choice input{margin:4px 0 0; accent-color:var(--brass); flex:none; width:18px; height:18px}
.choice .t{display:block; color:var(--ink); font-size:16px}
.choice .d{display:block; color:var(--ink-3); font-size:14px; margin-top:2px}
.choice > span:not(.ord){flex:1; min-width:0}
.choice .ord{flex:none; font-family:var(--sans); font-size:10.5px; color:var(--brass); letter-spacing:.1em; margin-top:6px; min-width:18px; text-align:right}
.tri{display:grid; gap:8px; margin:12px 0 26px}
.tri .row{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--hair); border-radius:3px; padding:12px 14px}
.tri .row.on{border-color:var(--brass)}
.tri .q{color:var(--ink); font-size:15.5px}
.tri .opts{display:flex; gap:4px; flex-wrap:wrap}
.tri .opts label{font-family:var(--sans); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); border:1px solid var(--hair); border-radius:3px; padding:6px 9px; cursor:pointer; min-height:34px; display:inline-flex; align-items:center; gap:6px}
.tri .opts label:hover{border-color:var(--brass); color:var(--ink)}
.tri .opts input{position:absolute; opacity:0; width:1px; height:1px}
.tri .opts input:checked + span{color:var(--brass)}
.tri .opts label:has(input:checked){border-color:var(--brass); color:var(--brass); background:var(--brass-dim)}
.tri .opts label:has(input:focus-visible){outline:2px solid var(--brass); outline-offset:2px}
@media (max-width:560px){ .tri .row{grid-template-columns:1fr} }
.radios{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 26px}
.radios label{font-family:var(--sans); font-size:12px; letter-spacing:.06em; color:var(--ink-2); border:1px solid var(--hair); border-radius:3px; padding:9px 12px; cursor:pointer; min-height:40px; display:inline-flex; align-items:center}
.radios input{position:absolute; opacity:0; width:1px; height:1px}
.radios label:has(input:checked){border-color:var(--brass); color:var(--brass); background:var(--brass-dim)}
.radios label:has(input:focus-visible){outline:2px solid var(--brass); outline-offset:2px}
.figpicks{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 26px}
.figpicks label{font-family:var(--serif); font-size:14.5px; color:var(--ink-2); border:1px solid var(--hair); border-radius:3px; padding:8px 12px; cursor:pointer; min-height:40px; display:inline-flex; align-items:center}
.figpicks input{position:absolute; opacity:0; width:1px; height:1px}
.figpicks label:has(input:checked){border-color:var(--brass); color:var(--ink); background:var(--brass-dim)}
.figpicks label:has(input:focus-visible){outline:2px solid var(--brass); outline-offset:2px}

/* ---------- guide ---------- */
.card{display:block; background:var(--surface); border:1px solid var(--hair); border-radius:3px; padding:18px 20px; margin:0 0 12px; text-decoration:none; color:inherit; transition:border-color .18s, transform .12s}
.card:hover{border-color:var(--brass); transform:translateX(3px)}
.card .num{margin-bottom:6px}
.card h3,.card h2.sec{margin:0 0 4px; font-size:22px}
.card .k{font-family:var(--serif); font-style:italic; color:var(--brass); font-size:15px; margin:0 0 8px}
.card .why{font-size:14.5px; color:var(--ink-2); margin:0}
.card .why b{color:var(--ink); font-weight:400}
.card .prog{font-family:var(--sans); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-top:10px}
.card .prog.done{color:var(--tag-research)}
.reflect{border-left:1px solid var(--brass); padding:4px 0 4px 18px; margin:0 0 22px}
.reflect p{margin:0 0 8px; font-size:15px}
.reflect .you{font-style:italic; color:var(--ink)}

/* ---------- exercise page ---------- */
.exhead{margin-bottom:26px}
.exhead .summary{font-size:17px; color:var(--ink)}
.meta{font-family:var(--sans); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); display:flex; gap:14px; flex-wrap:wrap; margin:10px 0 0}
.tailored{background:var(--surface); border:1px solid var(--hair); border-left:2px solid var(--brass); border-radius:3px; padding:14px 18px; margin:22px 0}
.tailored p{margin:0 0 8px; font-size:15px}
.tailored p:last-child{margin:0}
.tailored .kicker{margin-bottom:6px}
section.part{padding:30px 0 6px; border-top:1px solid var(--hair)}
section.part .head{display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap}
section.part .head h3,section.part .head h2.sec{margin:0}
section.part p{font-size:15.5px; line-height:1.68}
.prompt{margin:0 0 26px}
.prompt label{display:block; font-family:var(--serif); font-size:18px; line-height:1.45; color:var(--ink); margin-bottom:8px}
.prompt .help{font-size:14px; color:var(--ink-3); margin:0 0 10px}
.prompt textarea{width:100%; min-height:120px; resize:vertical; font:16px/1.55 var(--serif); color:var(--ink); background:var(--surface); border:1px solid var(--hair-2); border-radius:3px; padding:12px 14px}
.prompt textarea:focus{border-color:var(--brass); outline:none}
.prompt .pmeta{display:flex; justify-content:space-between; font-family:var(--sans); font-size:11px; color:var(--ink-3); letter-spacing:.06em; margin-top:6px}
.closing{border-left:1px solid var(--brass); padding:2px 0 2px 18px; margin:6px 0 10px; font-size:15px; color:var(--ink)}
.exnav{display:flex; justify-content:space-between; gap:10px; margin-top:34px; padding-top:22px; border-top:1px solid var(--hair); flex-wrap:wrap}
.exnav a{text-decoration:none; font-family:var(--sans); font-size:12.5px; letter-spacing:.06em; color:var(--ink-3)}
.exnav a:hover{color:var(--brass)}

/* video slot */
.video{border:1px dashed var(--hair-2); border-radius:3px; padding:18px 20px; margin:24px 0}
.video .kicker{margin-bottom:6px}
.video h4{margin:0 0 6px}
.video p{font-size:14.5px; margin:0 0 10px}
.video .frame{position:relative; width:100%; aspect-ratio:16/9; background:var(--surface); border:1px solid var(--hair); border-radius:3px; display:grid; place-items:center; color:var(--ink-3); font-family:var(--sans); font-size:12px; letter-spacing:.1em; text-transform:uppercase; margin-top:12px; overflow:hidden}
.video .frame iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.video .frame.empty{aspect-ratio:auto; height:96px}

/* sources */
.sources{margin-top:8px}
.sources li{margin:0 0 12px; font-size:14px; line-height:1.6; color:var(--ink-2); list-style:none; padding-left:0}
.sources ul{padding:0; margin:0}
.sources .tag{margin-right:8px}
.permalink{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:8px}
.permalink code{font:12.5px/1.5 var(--mono); color:var(--ink-2); background:var(--surface); border:1px solid var(--hair); padding:6px 10px; border-radius:3px; word-break:break-all}

/* ---------- figures ---------- */
.figgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; margin:10px 0 30px}
.figgrid .card{margin:0}
.figgrid .card h3,.figgrid .card h2.sec{font-size:20px}
.figgrid .card .k{font-size:14px}
.origin{font-family:var(--sans); font-size:12.5px; color:var(--ink-3); margin:0 0 20px}

/* ---------- notebook ---------- */
.entry{padding:14px 0; border-bottom:1px solid var(--hair)}
.entry .q{font-size:15px; color:var(--ink-3); margin:0 0 6px}
.entry .a{white-space:pre-wrap; color:var(--ink); font-size:15.5px; margin:0}
.entry .when{font-family:var(--sans); font-size:11px; color:var(--ink-3); letter-spacing:.06em; margin-top:6px}
.nbsec{margin:34px 0 10px}
.danger{border-color:#b04a4a; color:#d27a7a}
.danger:hover{border-color:#d27a7a; color:#e79a9a}
input[type=file]{font-family:var(--sans); font-size:13px; color:var(--ink-2)}
.dialog{background:var(--surface); border:1px solid var(--hair-2); border-radius:3px; padding:16px 18px; margin:14px 0}

/* ---------- about ---------- */
.about p{font-size:15.5px}

/* ---------- responsive ---------- */
@media (max-width:560px){
  body{font-size:16px}
  .shell{padding:0 16px 64px}
  .mark{font-size:10px; letter-spacing:.1em}
  nav.top{margin-bottom:26px}
  .prompt label{font-size:17px}
  h2{font-size:28px}
}

/* ---------- print ---------- */
@page{ margin:15mm; }
@media print{
  :root, :root:not([data-theme="dark"]), :root[data-theme="light"], :root[data-theme="dark"]{
    --plane:#fff; --surface:#fff; --surface-2:#fff;
    --ink:#000; --ink-2:#1f1f1e; --ink-3:#55534e;
    --hair:#d4d2cb; --hair-2:#b0aea6;
    --brass:#7a5f18; --brass-dim:#f3efe2;
    --tag-jung:#7a5f18; --tag-later:#2a5f95; --tag-research:#2f6b3c; --tag-project:#8a3d63;
  }
  html,body{background:#fff!important; color:#000; font-size:11pt}
  #ground,#vignette,nav.top,.tbtn,.btnrow,.exnav,.video,.permalink,.status,.skip,.noprint,.said{display:none!important}
  .shell{max-width:100%; padding:0}
  header.bar{padding:0 0 8px; border-bottom:1px solid #d4d2cb; margin-bottom:18px}
  .screen{animation:none!important}
  .card{border:1px solid #d4d2cb; break-inside:avoid; transform:none}
  section.part{break-inside:auto; padding-top:18px}
  .prompt{break-inside:avoid}
  .prompt textarea{display:none}
  .prompt .printed{display:block!important; white-space:pre-wrap; border:1px solid #d4d2cb; padding:8px 10px; min-height:2.4em; font-size:11pt; color:#000; margin-top:4px}
  .prompt .pmeta{display:none}
  h2{break-after:avoid} h3,h4{break-after:avoid}
  .tailored,.reflect,.closing,.entry{break-inside:avoid}
  a{color:inherit; text-decoration:none}
  .printonly{display:block!important}
}
.printed,.printonly{display:none}
</style>
</head>

<div id="ground" aria-hidden="true"></div>

    <span class="spacer"></span>
    <span class="status" id="status" aria-live="polite" aria-atomic="true"></span>
    <button class="tbtn" id="theme" aria-label="Toggle light and dark">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="themeIcon" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>
  <nav class="top" id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>

<script>
/* ============================================================
   The Structure of the Psyche — A Jungian Reflection Companion
   data.js · framing content: labels, starting points, experience
   notes, About text. No logic. Exercises live in exercises.js,
   the figures in figures.js.
   ============================================================ */

const META = {
  title: 'The Structure of the Psyche',
  subtitle: 'A Jungian Reflection Companion',

{ id: 'orientation', num: 'One', name: 'The compass',

  summary: 'Jung’s two attitudes and four functions as he meant them: a critical apparatus for looking, not a set of labels. You write about actual situations and say which descriptions feel familiar and which feel foreign.',

  video: { url: '', title: 'Typology: what Jung meant by a compass' },
  tailor: {},
  parts: [
    { kind: 'text', label: 'jung', heading: 'What Jung wrote',
      html: `<p>In <em>Psychological Types</em> (1921) Jung distinguished two <strong>attitudes</strong> — extraversion and introversion, “distinguished by the direction of general interest or libido movement” (Baynes 1923, ch. X) — and four <strong>functions</strong>: “thinking, feeling, sensation, and intuition. If one of these functions habitually predominates, a corresponding type results” (CW 6 §7). He could give no a priori reason for exactly four; “this conception has shaped itself out of many years’ experience” (Definitions, “Function”). In a 1923 lecture he put the four to work in one sentence: “thinking should facilitate cognition and judgment, feeling should tell us how and to what extent a thing is important or unimportant for us, sensation should convey concrete reality to us, and intuition should enable us to divine the hidden possibilities in the background” (CW 6 §900°).</p>
<p>Thinking and feeling are <em>rational</em> functions, “decisively influenced by the motive of reflection”; sensation and intuition are <em>irrational</em>, aiming “at pure perception” (Definitions, “Rational”, “Irrational”). One function is usually more <em>differentiated</em> than the others — separated “from other functions, and … its individual parts from each other”, so that it can be directed (CW 6 §705°) — and one remains “in arrear in the process of differentiation”: the inferior function, “‘inferior’ in the psychological, though not in the psycho-pathological, sense” (Definitions, “Inferior function”). Its “essence … is autonomy: it is independent, it attacks, it fascinates” (CW 7 §85°).</p>
<p>Three of Jung’s cautions belong on the same page as the scheme. “There can never be a pure type in the sense that it possesses only one mechanism with the complete atrophy of the other. A typical attitude always means merely the relative predominance of one mechanism” (CW 6 §6). “It is often very difficult to find out whether a person belongs to one type or the other, especially in regard to oneself. In respect of one’s own personality one’s judgment is as a rule extraordinarily clouded” (CW 6 §3). And, in the 1934 foreword to the Argentine edition: “this kind of classification is nothing but a childish parlour game … My typology is far rather a critical apparatus serving to sort out and organize the welter of empirical material, but not in any sense to stick labels on people at first sight.” The four functions, he wrote in 1931, “are somewhat like the four points of the compass; they are just as arbitrary and just as indispensable” (CW 6 §958–959°). In 1957 he told an interviewer: “There is no such thing as a pure extravert or a pure introvert. Such a man would be in the lunatic asylum” (Evans interviews, <em>C. G. Jung Speaking</em>).</p>
<p>On the second function, the whole of what Jung wrote fits in a few sentences (CW 6 §666–670). One function has “absolute sovereignty”; a second, “of secondary importance, and therefore of inferior differentiation in consciousness, is constantly present”; it must be of the other class — a rational leader takes an irrational helper, “never” its rational opposite; it “is possible and useful only in so far as it serves the leading function”; and it is “in every respect different from the nature of the main function” (Baynes 1923, from p. 513 ≈ §667–669). He says nothing there about the helper’s attitude, nothing about a third function, and nothing about an order of four.</p>` },
    { kind: 'text', label: 'later', heading: 'What came after',
      html: `<p>The “function stack” you will meet on the internet — dominant, auxiliary, tertiary, inferior, with attitudes alternating down the list — is not in Jung. Isabel Briggs Myers built the first step from a single phrase: “The operative words are ‘in every respect.’ If the auxiliary process differs from the dominant process in every respect, it cannot be introverted where the dominant process is introverted” (<em>Gifts Differing</em>, 1980). She also wrote that Jung’s “only allusions to this fact are cryptically brief” and that her sixteen types and the judging–perceiving preference are not in <em>Psychological Types</em>. The MBTI manual’s co-author is equally candid: “Jung did not provide clear guidelines regarding the attitude of the auxiliary and tertiary functions. Myers and Briggs amplified and extended Jung’s theory” (Quenk 2009). The tertiary’s attitude was fixed by Harold Grant and by John Beebe, both in 1983; Beebe, whose eight-function model is the fullest version, writes that Jung “never made clear that the attitude type of the two functions … would alternate”, and calls Myers’s reading a “creative misreading”. Joseph Wheelwright, who co-wrote the first Jungian type survey, held the opposite view — that dominant, auxiliary and tertiary share one attitude (reported by Beebe). Marie-Louise von Franz, the most faithful of Jung’s students, spoke of “the two auxiliary functions” in the plural, assigned them no attitude, and said the theory “has a kind of practical value, but it is not a dogma” — “a heuristical standpoint, a hypothesis by which you can find out things” (<em>Lectures on Jung’s Typology</em>, 1971, p. 52).</p>
<p>Von Franz did give the inferior function its clinical portrait: “slow, heavy, and loaded with emotion” (p. 31), “the door to experiencing the deeper layers of the unconscious” (p. 32), touchy and tyrannical, and not to be forced: she never pushes a thinking type “into feeling at once” but sees that “the other functions are first assimilated” (p. 18). Her two practical questions are the ones this exercise borrows: what do you habitually do most easily, and “where does he feel that he always knocks his head against the obstacle and suffers hell? That generally points to the inferior function” (p. 16). She also warned that “the extravert swears that he is deeply introverted, and vice versa” (p. 15), and that “you need the whole case history” before saying anything about type (p. 51).</p>` },
    { kind: 'text', label: 'research', heading: 'What the evidence says',
      html: `<p>Extraversion–introversion is the best-supported idea here — as a <em>continuous</em> trait, not a pair of boxes. Scores on Jungian and Myers–Briggs instruments are centre-weighted rather than bimodal (McCrae &amp; Costa 1989; Bess &amp; Harvey 2002, who showed that the one apparently bimodal result was a scoring artefact); the E–I scale correlates about −0.70 with Five-Factor Extraversion, S–N with Openness, T–F with Agreeableness (McCrae &amp; Costa 1989). A four-letter type label is unstable: “as many as 50 percent of the people will be classified into a different type” on retest within weeks (Pittenger 1993, citing Howes &amp; Carskadon 1979). Jung’s assumption that thinking and feeling, sensation and intuition are opposites is not supported when items are not forced-choice (Girelli &amp; Stake 1993; Lee &amp; Kim 2024). Even trained analysts and their own survey agreed on the eight basic types only “about 60 per cent” of the time (Bradway &amp; Wheelwright 1978). And “type dynamics” — the stack — has been tested and has failed: “scores for the dominant are greater than those for the auxiliary in only about half the types” (McCrae &amp; Costa 1989); “the empirical record is inconsistent with type dynamics and often contradicts it in ways that are fatal for the construct” (Reynierse 2009). No published study validates the eight-archetype model.</p>` },

<dl class="portraits">
<dt>Thinking, turned outward</dt><dd>Orders the world by shared facts and criteria; trusts a conclusion once it can be stated, defended and applied. Its danger, in Jung’s account, is the formula that keeps running after the situation has changed.</dd>

<dt>Sensation, turned outward</dt><dd>Attends to what is here, in detail, and acts on it. Its danger is that the moment becomes all there is.</dd>

<dt>Intuition, turned outward</dt><dd>Perceives what a thing could become; possibilities multiply on contact. Its danger is leaving before the work is done.</dd>
<dt>Intuition, turned inward</dt><dd>Attends to the pattern beneath the surface and reaches a conclusion before the route can be shown. Its danger is a vision that explains everything and can be corrected by nothing.</dd>

  parts: [
    { kind: 'text', label: 'jung', heading: 'What Jung wrote',
      html: `<p>“The persona is a function-complex which has come into existence for reasons of adaptation or necessary convenience, but by no means is it identical with the individuality” (Baynes 1923, Definitions, “Soul” = CW 6 §801). It is “only a mask of the collective psyche, a mask that is a substitute for individuality”; “a compromise between the individual and society as to the kind of semblance to adopt, what a man should ‘appear to be.’ He takes a name, earns a title, represents an office … In a certain sense all this is real, yet in relation to the essential individuality it is only a secondary reality” (Baynes 1928, pp. 164–165 ≈ CW 7 §245–246). Elsewhere: “The persona is that which in reality one is not, but which oneself as well as others think one is” (CW 9i §221°).</p>
<p>Jung did not think the mask a lie to be removed. It has two legitimate functions — “to make a definite impression upon others, while, on the other, it cloaks the true nature of the individual” — and “society expects, and indeed must expect, that every individual should play the rôle assigned to him as completely as possible … hence the construction of an artificial personality becomes an unavoidable necessity” (Baynes 1928, p. 208 ≈ CW 7 §305). Only someone “so identified with his persona that he no longer knows himself” would call its concealing function superfluous. People without a workable persona exist too, “blundering from one social solecism to the next” (CW 7 §318°).</p>
<p>The danger is identification. “There are people who actually believe themselves to be what they present to the public view”; the unconscious will not “endure this artificial shifting of the centre of gravity”; “whoever builds up too good a persona has to pay for it in irritability.” “A man cannot get rid of himself in favour of an artificial personality without punishment. The mere attempt to do so releases … unconscious reactions in the form of moods, affects, fears, compulsive ideas”; “the ‘strong man’ socially is often a mere child in relation to his own feeling, and his public discipline (which he often demands unquestioningly from others) goes to pieces entirely in private” (Baynes 1928, pp. 209–210 ≈ CW 7 §305–307). And there is a second failure, after a difficult encounter with oneself: the “regressive restoration of the persona”, in which a person “becomes smaller, more limited, more rationalistic than before” and whose “resignation and self-depreciation is an evasion, which in the long run can only be maintained by neurotic suffering” (Baynes 1928, pp. 176–178 ≈ CW 7 §254–259). The aim, as he put it, is “to free the self from the false wrappings of the persona on the one hand, and from the suggestive power of the unconscious images on the other” (≈ CW 7 §269).</p>` },
    { kind: 'text', label: 'later', heading: 'What came after',
      html: `<p>The classical clinical reading is Daryl Sharp’s: a psychological understanding of the persona as a function of relationship “makes it possible to assume and drop one at will”, and the outside world “invites identification with it” by rewarding a particular persona (<em>Jung Lexicon</em>, 1991). Outside Jung, the sociology of everyday self-presentation — Erving Goffman’s <em>The Presentation of Self in Everyday Life</em> (1956) is the classic — treats role performance as ordinary and skilled, which agrees with Jung’s “unavoidable necessity” and cuts against any reading of role-switching as inauthenticity. Post-Jungian writers have not seriously disputed the concept; the word “authenticity”, which the earlier inventory’s items implied, does not occur in Jung’s passages on the persona at all.</p>` },
    { kind: 'text', label: 'research', heading: 'What the evidence says',
      html: `<p>That people present different selves in different settings is among the best-documented facts of social psychology; it is not in itself a sign of anything. What has not been operationalised is Jung’s specific claim — identification producing a compensating private life. There is a structural reason a questionnaire cannot detect it: on Jung’s own account the identified person “no longer knows himself”, and the compensating figure “remains completely in the dark and is at once projected” (CW 7 §309°). The people most affected are least able to report it. There is also no correct amount of persona to score, which is why this exercise has no scale.</p>` },
    { kind: 'prompts', label: 'project', heading: 'The exercise',
      intro: 'Three separate questions the old scale merged: flexibility, identification, and shrinkage. Take them one at a time.',
      prompts: [
        { id: 'p1', q: 'List the roles you play in an ordinary week — at work, at home, online, with old friends, with strangers. Beside each, note whether you could put it down for a day without unease.',
          help: 'A long list is not a problem. Jung’s persona is plural (“personae”, CW 6 Definitions). The interesting entries are the ones you could not put down.' },
        { id: 'p2', q: 'Describe a room where you are one way and a room where you are another. Is the difference a cost, a competence, or simply appropriate to the room?',
          help: 'Consistency across rooms was scored as “healthy” by the earlier inventory. Jung says the opposite: a mask suited to the room is what adaptation looks like.' },
        { id: 'p3', q: 'Jung’s signs of identification: irritability; a public discipline that goes to pieces in private; moods, fears or compulsions that arrive when the role is at its best; needing to be seen only prepared. Which, if any, do you recognise — and on what occasion?',
          help: 'Write the occasion, not the trait. “Sometimes irritable” describes everyone; “I snapped at my partner the evening the presentation went perfectly” is material.' },
        { id: 'p4', q: 'If your main role ended tomorrow, what would remain that other people could relate to? And after the last hard period of your life, did you come back the same size, larger, or smaller and safer?',
          help: 'The second question is Jung’s “regressive restoration of the persona”. He was blunt that resignation dressed as humility is an evasion — but he also said it is “a vital possibility” for someone whose troubles came from inflation (Baynes 1928, p. 178). Both readings are open.' }
      ],
      closing: 'A step forward: choose one role from your list that you cannot put down and do the smallest thing that role would never do — leave a message unpolished, let someone see you unprepared, ask for help with something you could manage alone. Notice what the unconscious sends in reply.' },
    { kind: 'text', label: 'project', heading: 'Exceptions and other readings',
      html: `<p>A gap between the face and the inside is often protection, not identification: people mask in unsafe places for good reasons, and a role held tightly in one setting may be the right size elsewhere. Discomfort at being seen unprepared can be ordinary shyness, or an accurate reading of a hostile room. Irritability has a hundred causes before it has a Jungian one — sleep, pain, overwork, a difficult person. The absence of a persona is also a difficulty, and a person who “blunders from one social solecism to the next” may need to build a mask rather than examine one. Jung’s sharpest sentence cuts both ways: the persona is a compromise “in which others often have a greater share in the making than the individual himself” (Baynes 1928, p. 165). If a role does not fit, the first question is who made it.</p>` }
  ],
  sources: [
    { label: 'jung', text: 'Jung, C. G. <em>Two Essays on Analytical Psychology</em>, CW 7: “The Persona as a Segment of the Collective Psyche” (§244–247°); “Negative Attempts to Free the Individuality from the Collective Psyche” (≈ §254–263); “The Function of the Unconscious” (§266–269°); “Anima and Animus” §305–309°, §318°. Public-domain text: Baynes translation, 1928, pp. 164–182, 183–185, 207–211. <em>Psychological Types</em>, CW 6 Definitions “Soul”, §797–807° (§801, §804, §807). <em>The Archetypes and the Collective Unconscious</em>, CW 9i §221° (“Concerning Rebirth”).' },
    { label: 'later', text: 'Sharp, D. <em>Jung Lexicon: A Primer of Terms and Concepts</em> (Inner City Books, 1991), “Persona”. Goffman, E. <em>The Presentation of Self in Everyday Life</em> (1956).' }
  ]
},

{ id: 'complexes', num: 'Three', name: 'Where you react out of proportion',
  kicker: 'complexes, and the moments that have us',
  summary: 'Jung’s most concrete idea. A complex is recognised by what it does — a reaction out of proportion, a blank, a blockage — and everyone has them. The exercise asks for occasions, for what they have in common, and for the ordinary explanations first.',
  minutes: '15–25',
  video: { url: '', title: 'Complexes: the psyche’s splinters' },
  tailor: {
    overreact: 'You noted situations in which you react more strongly than the occasion warrants. That is, almost word for word, Jung’s criterion for a complex — and also, as he insisted, something that happens to everyone. The prompts ask you to describe two or three of those occasions before reading anything into them.',
    mood: 'You noted a mood you could not trace. Jung treated such moods as one of the ways a complex “interferes with the intentions of the will”; the same experience is taken up from a different angle in “The inner other”.',
    irritation: 'You noted someone who gets under your skin. Before the shadow exercise, it is worth asking here what the reaction has in common with other moments when you lose proportion.'
  },
  parts: [
    { kind: 'text', label: 'jung', heading: 'What Jung wrote',
      html: `<p>A feeling-toned complex “is the image of a certain psychic situation which is strongly accentuated emotionally and is, moreover, incompatible with the habitual attitude of consciousness” (CW 8 §201, “A Review of the Complex Theory”, 1934). The idea grew out of Jung’s early word-association experiments, where certain words produced delays, blanks and physical reactions the subject could not control. “Everyone knows nowadays that people ‘have complexes.’ What is not so well known, though far more important theoretically, is that complexes can have us” (CW 8 §200°). They are “splinter psyches” (§204°); they “interfere with the intentions of the will and disturb the conscious performance; they produce disturbances of memory and blockages in the flow of associations; they appear and disappear according to their own laws” (CW 8 §253°). For Jung they, not dreams, were the royal road: “fear and resistance are the signposts that stand beside the via regia to the unconscious”; the complex is “the architect of dreams and of symptoms” (§210).</p>
<p>They are universal and not in themselves a disorder. “Some degree of one-sidedness is unavoidable, and, in the same measure, complexes are unavoidable too” (CW 8 §255°). “Complexes are focal or nodal points of psychic life which we would not wish to do without” (CW 6 §925°). “The possession of complexes does not in itself signify neurosis … and the fact that they are painful is no proof of pathological disturbance” (CW 16 §179°). And: “A complex can be really overcome only if it is lived out to the full” (CW 9i §184).</p>` },
    { kind: 'text', label: 'later', heading: 'What came after',
      html: `<p>Jolande Jacobi’s <em>Complex/Archetype/Symbol</em> (1959, with a foreword by Jung) gave the doctrine its textbook form: a personal, feeling-toned complex gathers around an archetypal core and expresses itself in symbols. The developmental school (Fordham and the London analysts) read complexes through early relationships and the mother–infant field. In popular use the word has drifted toward “hang-up”; Jung’s sense is stronger and less moralised — a piece of the psyche with its own charge and its own timetable.</p>` },
    { kind: 'text', label: 'research', heading: 'What the evidence says',
      html: `<p>The general phenomenon has a solid footing: emotionally charged material captures attention and disrupts performance, which is what Jung’s association experiments were measuring a century ago and what modern attentional-interference paradigms measure now. The specific Jungian architecture — an archetypal nucleus, a “splinter psyche” with intentions — has not been tested and is not the kind of claim that can be. For this exercise the practical point is Jung’s: complexes are known by their effects, and the ego’s report is exactly what they disturb, so a questionnaire cannot name your complex. You can.</p>` },
    { kind: 'prompts', label: 'project', heading: 'The exercise',
      intro: 'Occasions first; readings later. Keep each answer short and concrete.',
      prompts: [
        { id: 'c1', q: 'Name two or three occasions when your reaction was out of proportion — anger, tears, a blank, a sudden withdrawal, a joke that went too far. For each: what happened just before, and what did you do?',
          help: 'Include one that embarrassed you. Jung’s “fear and resistance” are the signposts, so the occasion you would rather not write down is usually the useful one.' },
        { id: 'c2', q: 'What do those occasions have in common? A word someone used, a tone of voice, a kind of person, a kind of demand, a place, a time of day?',
          help: 'Look for the trigger, not the theme. “Being told what to do by someone younger, in front of others” is a finding; “authority issues” is a label.' },
        { id: 'c3', q: 'Before any Jungian reading: which ordinary explanation covers each occasion? Tiredness, a real threat, a history with this person, a value that was actually crossed, hunger, illness?',
          help: 'If the ordinary explanation covers it completely, stop there. A complex is what remains when the situation has been given its due.' },
        { id: 'c4', q: 'For the occasion that is not covered: if a “splinter psyche” were speaking in that moment, what would it be defending, and how old does it sound?',
          help: 'Write it as speech, in the first person. This is a way of describing, not a way of knowing; Jung said complexes “have us”, so treat your answer as a sketch to test against the next occasion.' }
      ],
      closing: 'A step forward: the next time the trigger you found in the second answer appears, name it silently before you react — not to stop the reaction, but to see whether naming changes its size. Note what happened, here, afterwards.' },
    { kind: 'text', label: 'project', heading: 'Exceptions and other readings',
      html: `<p>Some reactions are proportionate and only look excessive to people who were not harmed. Pain is “no proof of pathological disturbance”, but neither is calm a proof of health. Reactions that follow a traumatic event — startle, flashback, shutdown — belong to a different frame and deserve a professional rather than a prompt. And a complex, in Jung’s sense, is not something to be rid of: he wrote that psychic activity without them “would come to a fatal standstill” (CW 6 §925°). The useful question is not whether you have complexes but which one has been steering lately.</p>` }
  ],
  sources: [
    { label: 'jung', text: 'Jung, C. G. “A Review of the Complex Theory” (1934), CW 8 §194–219 (§200°, §201, §204°, §210); “Psychological Factors Determining Human Behaviour”, CW 8 §253°, §255°; <em>Psychological Types</em>, CW 6 §925° (“A Psychological Theory of Types”); <em>The Practice of Psychotherapy</em>, CW 16 §179°; “Psychological Aspects of the Mother Archetype”, CW 9i §184; <em>Experimental Researches</em>, CW 2 (the association studies, 1904–1910).' },
    { label: 'later', text: 'Jacobi, J. <em>Complex/Archetype/Symbol in the Psychology of C. G. Jung</em> (Bollingen, 1959). Sharp, D. <em>Jung Lexicon</em> (1991), “Complex”.' }
  ]
},

{ id: 'shadow', num: 'Four', name: 'What gets under your skin',
  kicker: 'the shadow and projection, as questions',
  summary: 'Jung made the shadow the thing that resists being seen, and said that “one meets with projections, one does not make them”. So an irritation cannot be scored into a disowned quality. The exercise keeps the irritation as a starting point, lays the ordinary explanations beside the Jungian one, and adds the positive shadow.',
  minutes: '25–35',
  video: { url: '', title: 'The shadow: Aion, chapter II, read slowly' },
  tailor: {
    irritation: 'You noted someone who gets under your skin out of proportion. That is the starting point Jung gives, and only the starting point: the second prompt asks what else explains it, and the third asks whether the quality lives anywhere in you. Either answer can be honest.',
    fascination: 'You noted a fascination or aversion that makes more sense than it should. Jung thought the strongest projections of that kind were not shadow at all but the inner other (Aion §19); the same experience appears in that exercise from the other side.',
    overreact: 'You noted situations in which you react out of proportion. Not every such reaction concerns another person; the ones that do belong here.'
  },
  parts: [
    { kind: 'text', label: 'jung', heading: 'What Jung wrote',
      html: `<p>The shadow chapter of <em>Aion</em> (1951) is two pages long. “The shadow is a moral problem that challenges the whole ego-personality, for no one can become conscious of the shadow without considerable moral effort … This act is the essential condition for any kind of self-knowledge, and it therefore, as a rule, meets with considerable resistance” (CW 9ii §14). The traits in question “have an emotional nature”, and “emotion, incidentally, is not an activity of the individual but something that happens to him” (§15). “With insight and good will, the shadow can to some extent be assimilated”, but “certain features … offer the most obstinate resistance to moral control” and “are usually bound up with projections, which are not recognized as such”; a person “must be convinced that he throws a very long shadow before he is willing to withdraw his emotionally-toned projections from their object” (§16). Then the decisive sentences: “It is not the conscious subject but the unconscious which does the projecting. Hence one meets with projections, one does not make them. The effect of projection is to isolate the subject from his environment … Projections change the world into the replica of one’s own unknown face” (§17). And a limit: past a certain point the most stubborn projections belong not to the shadow, “which is always of the same sex as the subject”, but to a contrasexual figure (§19).</p>
<p>Elsewhere: “The shadow is a living part of the personality and therefore wants to live with it in some form. It cannot be argued out of existence or rationalized into harmlessness”; “the meeting with oneself is, at first, the meeting with one’s own shadow. The shadow is a tight passage, a narrow door” (CW 9i §44–45). It is not simply bad: the shadow “does not consist only of morally reprehensible tendencies, but also displays a number of good qualities” (CW 9ii §423); it is “merely somewhat inferior, primitive, unadapted, and awkward; not wholly bad” (CW 11 §134°). The sentence quoted everywhere — “Everything that irritates us about others can lead us to an understanding of ourselves” — is genuine (<em>Memories, Dreams, Reflections</em>, “Travels”), but its context is national character: it continues, “I understand England only when I see where I, as a Swiss, do not fit in.” It says <em>can</em>.</p>` },
    { kind: 'text', label: 'later', heading: 'What came after',
      html: `<p>Marie-Louise von Franz (<em>Projection and Re-Collection in Jungian Psychology</em>, 1980) described the withdrawal of a projection as a process with stages — from taking the image for the person, through noticing the discrepancy, to finding the source in oneself. Her exact wording could not be verified for this companion, so the stages are not listed; the point that survives is that withdrawal is slow and cannot be decided. Erich Neumann (<em>Depth Psychology and a New Ethic</em>, begun in Tel Aviv in 1942) turned the shadow into an ethical argument: an ethic of perfection represses the shadow and then finds it in a scapegoat. The popular “shadow work” literature (Zweig &amp; Abrams, <em>Meeting the Shadow</em>, 1991; Johnson, <em>Owning Your Own Shadow</em>, 1991) kept the idea and flattened it toward a checklist; Fanny Brewster (<em>African Americans and Jungian Psychology</em>, 2017) has shown how the language of “dark” and “shadow” carried racial freight in Jung and after him, which is a reason to keep the concept moral and personal rather than visual.</p>` },
    { kind: 'text', label: 'research', heading: 'What the evidence says',
      html: `<p>Laboratory psychology tested a narrower claim than Jung’s — Freudian defensive projection — and for years called it “a myth” (Holmes, cited in Baumeister, Dale &amp; Sommer 1998). Then Newman, Duff and Baumeister (1997) found the mechanism: trying not to think that you have an undesirable trait makes the trait chronically accessible, so it is “used to interpret others’ behavior”; people who suppress a trait see it more readily in others. Schimel, Greenberg and Martens (2003) found that projecting a feared trait can relieve the threat. The reviewers’ conclusion: “projection is evident, but the projection itself may be a by-product of defense rather than part of the defensive response itself.” So the bias is real, and strongest for what one is trying not to see. That is a reason to look. It is not a rule that what you dislike in others is yours: seeing a trait in someone else is not evidence that you have it, and the research says nothing about positive projections, about a developmental sequence of withdrawal, or about the anima.</p>` },
    { kind: 'prompts', label: 'project', heading: 'The exercise',
      intro: 'The earlier inventory paired eight irritations with eight “disowned qualities”. That table is gone. Here the pairing, if there is one, is yours to find — or to reject.',
      prompts: [
        { id: 's1', q: 'Who gets under your skin out of proportion? Describe the behaviour, not the person, and say what the reaction feels like in the body and how long it lasts.',
          help: 'Jung’s criteria are emotion and disproportion. A calm, proportionate dislike is just a judgment.' },
        { id: 's2', q: 'What ordinary explanations are available? A real harm done; a value of yours actually crossed; a boundary; a history with this person or someone like them; the situation you were both in.',
          help: 'Write these as seriously as the Jungian reading. If one of them covers the reaction completely, the shadow question can rest.' },
        { id: 's3', q: 'Is there any form — however small, however differently dressed — in which the same quality lives in you, or once did, or is not allowed to?',
          help: 'The dressing matters. Loud self-promotion in another may meet a quiet, unadmitted wish to be seen; contempt for someone’s neediness may meet a need that was never permitted. Or it may not. “No, and here is why” is a complete answer.' },
        { id: 's4', q: 'The positive shadow: what would you never let yourself be seen doing — resting, wanting, being helped, being foolish, being angry, being ordinary? What might it give you?',
          help: 'Jung: the shadow “also displays a number of good qualities”. What the persona could not use is not always a vice.' },
        { id: 's5', q: 'A test: what would change if the quality from the third answer turned out to be partly yours? If nothing would change, the question may not be a shadow question at all.',
          help: 'This is this project’s prompt, not Jung’s. It exists because a shadow reading that costs nothing is usually a compliment in disguise.' }
      ],
      closing: 'A step forward: the next time the person from your first answer does the thing, wait for the reaction and then do nothing for a minute. Write down what the minute contained. Jung said a person must be “convinced that he throws a very long shadow” before anything moves; conviction comes from occasions, not from a page.' },
    { kind: 'text', label: 'project', heading: 'Exceptions and other readings',
      html: `<p>Dislike is not projection. Harm is harm, and some people are exactly as they seem; the concept of the shadow is not a reason to doubt your judgment of them. Some irritations are cultural or generational — a difference in manners is not a hidden wish. Jung himself said the strongest projections may not be shadow at all but belong to the inner other (§19), and that “certain features” resist every insight, so failing to find the quality in yourself is not a failure of honesty. The experimental result cuts the other way too: the trait you most confidently deny is the one to look at longest, but denial is not proof. If this exercise produces mainly self-accusation, stop; Jung’s shadow is met “with considerable moral effort”, not with contempt for oneself.</p>` }
  ],
  sources: [
    { label: 'jung', text: 'Jung, C. G. <em>Aion</em> (1951), CW 9ii, ch. II “The Shadow” §13–19; ch. III §42; Conclusion §422–423. <em>The Archetypes and the Collective Unconscious</em>, CW 9i §43–45; “Conscious, Unconscious, and Individuation” §513. <em>Psychology and Religion</em>, CW 11 §131°, §134°. “General Aspects of Dream Psychology”, CW 8 §507° (projection). <em>Psychological Types</em>, CW 6 §783° (Definitions, “Projection”). <em>Memories, Dreams, Reflections</em> (1963), “Travels”.' },
    { label: 'later', text: 'von Franz, M.-L. <em>Projection and Re-Collection in Jungian Psychology</em> (Open Court, 1980). Neumann, E. <em>Depth Psychology and a New Ethic</em> (1949; Eng. 1969). Zweig, C. &amp; Abrams, J. (eds) <em>Meeting the Shadow</em> (1991). Johnson, R. A. <em>Owning Your Own Shadow</em> (1991). Brewster, F. <em>African Americans and Jungian Psychology: Leaving the Shadows</em> (Routledge, 2017). Sharp, D. <em>Jung Lexicon</em> (1991), “Shadow”, “Projection”.' },
    { label: 'research', text: 'Newman, L. S., Duff, K. J. &amp; Baumeister, R. F. “A new look at defensive projection”, <em>Journal of Personality and Social Psychology</em> 72 (1997). Baumeister, R. F., Dale, K. &amp; Sommer, K. L. “Freudian defense mechanisms and empirical findings in modern social psychology”, <em>Journal of Personality</em> 66 (1998). Schimel, J., Greenberg, J. &amp; Martens, A. “Evidence that projection of a feared trait can serve a defensive function”, <em>Personality and Social Psychology Bulletin</em> 29 (2003).' }
  ]
},

/* ------------------------------------------------------------ 5 */
{ id: 'inner-other', num: 'Five', name: 'The inner other',
  kicker: 'moods, convictions and fascinations — Jung’s anima and animus, revised and labelled',
  summary: 'Jung tied the anima to men and the animus to women, and described them asymmetrically. This companion follows the post-Jungian revision that opens the “inner other” to anyone — and says so. The prompts concern experiences Jung attached to the figures: causeless moods, over-fierce opinions, fascinations out of proportion.',
  minutes: '25–35',
  video: { url: '', title: 'Anima and animus: what Jung said, and what has changed' },
  tailor: {
    mood: 'You noted a mood you could not trace to any cause. Jung attached such moods to the anima in men; this exercise offers the same question to anyone, with the ordinary explanations alongside.',
    conviction: 'You noted defending a position more fiercely than you believe it. Jung attached exactly that to the animus in women (“opinions … invariably collective”). The second prompt asks the question without the sex-assignment.',
    fascination: 'You noted a fascination or aversion out of proportion to the person. For Jung that was the signature of the “projection-making factor”; the third prompt takes it up.'
  },
  parts: [
    { kind: 'text', label: 'jung', heading: 'What Jung wrote',
      html: `<p>Jung’s formulation is explicitly sex-specific and asymmetrical, and it should be read as he wrote it before it is revised. “In the foregoing presentation, I have kept exclusively to masculine psychology. As a femininity, the anima is exclusively a compensating figure to masculine consciousness. In a woman, however, the compensating figure is masculine in character, and therefore can be appropriately termed the animus” (Baynes 1928, p. 225 ≈ CW 7 §328°). The anima compensates the persona: “the persona, the ideal picture of a man as he should be, is inwardly compensated by feminine weakness” (CW 7 §309°). The animus appears as opinion: “animus opinions are invariably collective in character, and they override individuals and individual judgments” (Baynes 1928, p. 226 = CW 7 §334°); “a woman possessed by the animus is always in danger of losing her femininity” (CW 7 §337°). In <em>Aion</em>: “Woman is compensated by a masculine element and therefore her unconscious has, so to speak, a masculine imprint. This results in a considerable psychological difference between men and women … The animus corresponds to the paternal Logos just as the anima corresponds to the maternal Eros” (CW 9ii §29); “it seems a very natural state of affairs for men to have irrational moods and women irrational opinions” (§35). The 1935 revision of the <em>Two Essays</em> adds the famous images — the animus as “an assembly of fathers or dignitaries of some kind who lay down incontestable, ‘rational,’ ex cathedra judgments” (CW 7 §332°), and “as the anima produces moods, so the animus produces opinions” (§331°).</p>
<p>What survives the revision is the structure, not the assignment: an inner figure, “not an invention of the conscious, but a spontaneous product of the unconscious” (§26), which is the “projection-making factor” (§20) behind fascinations and aversions; which compensates the outward attitude; and which, even when its contents are integrated, “remain[s] autonomous” — anima and animus “are factors transcending consciousness and beyond the reach of perception and volition” (§40). Jung also describes a technique of addressing the figure directly, “allowing our invisible partner to make herself heard”, and admits “the distaste one naturally feels at playing such an apparently ludicrous game with oneself” (CW 7 §323–324°).</p>` },
    { kind: 'text', label: 'later', heading: 'What came after — and what this companion does',
      html: `<p>Nearly every serious post-Jungian writer keeps the inner other and drops the sex-linkage. James Hillman (<em>Anima</em>, 1985) treated the anima as the archetype of psyche itself, belonging to anyone. Andrew Samuels diagnosed “a weddedness to binominalism” — “if men are rational, then woman must be … surprise, surprise, irrational” — and reads animus and anima as “the expansion of the roles available to both sexes” (<em>The Plural Psyche</em>, 1989; 2021). Polly Young-Eisendrath proposed “a modification of Jung’s concept of ‘animus’” (with Wiedemann, 1987) and rejects “the essentialist Jungian theory of Self” (2008). Verena Kast is the standard reference for the view that both sexes carry both figures, rooted in the mother- and father-complexes (2006). Susan Rowland records that the theory “has long been attacked as Jung’s own personal (and highly questionable) views of the proper roles of men and women, cast in universalistic terms” (2011); Susan McKenzie argues that gendered feeling is “an emergent aspect of mind and not an archetypal inheritance” (2006); recent work extends the critique to LGBTQI+ identities (Carter 2024; Perrin 2024). Earlier feminist critiques are Goldenberg (1976) and Wehr (1987).</p>
<p><strong>This companion follows the revision.</strong> It treats the inner other as available to anyone, keeps Jung’s phenomena — the mood without a cause, the opinion held past belief, the fascination out of proportion — as prompts, and refuses to assign anyone an anima or an animus on the basis of their sex. That is a contemporary adaptation, labelled as one. Where the exercise says “Jung”, it means the sex-specific text above.</p>` },
    { kind: 'text', label: 'research', heading: 'What the evidence says',
      html: `<p>There is no empirical support for a contrasexual structure in the unconscious, and no way to test one. The phenomena Jung attached to the figures are ordinary and well documented in their own right: mood without an identifiable cause, opinions held with a certainty that outruns the evidence, attraction and aversion shaped by what one does not see in oneself (the projection research is summarised in “What gets under your skin”). The earlier inventory’s “inner counterpart” scale asked about these and produced a percentage; five agree-or-disagree items cannot distinguish a Jungian “possession” from a bad week, and the descriptions that followed were of the kind people accept most readily when they are flattering and personalised (Dickson &amp; Kelly 1985). The prompts below therefore ask for occasions, not endorsements.</p>` },
    { kind: 'prompts', label: 'project', heading: 'The exercise',
      intro: 'Four experiences, taken one at a time, each with the ordinary explanation beside the Jungian one.',
      prompts: [
        { id: 'i1', q: 'A mood that arrived without a cause you could name: describe one. What preceded it by a day or two? What did it seem to want — quiet, attention, a fight, a change?',
          help: 'Jung read such moods as the inner figure’s way of reacting to the persona. Sleep, hormones, weather and an unnoticed slight are also candidates; list them.' },
        { id: 'i2', q: 'A conviction you defended more fiercely than you actually hold it: on what occasion, against whom? What would you have lost by conceding?',
          help: '“Opinion for opinion’s sake” was Jung’s phrase for the animus. Sometimes a conviction is fierce because it is right and unpopular. Write down which this was.' },
        { id: 'i3', q: 'A fascination or an aversion out of proportion to the person: what did you see in them? Is any of it something you do not allow yourself to be, or to want?',
          help: 'Jung’s “projection-making factor”. The person may also simply be remarkable or repellent; both things can be true.' },
        { id: 'i4', q: 'If this inner other had a face and a voice — in a dream, a story, a fantasy — what would it look like, and what would it ask of you? Write a short exchange with it.',
          help: 'A gentle form of the technique Jung describes. Keep it brief and grounded, and stop if it unsettles you; Jung reserved the full method for people with a firm footing in ordinary life.' }
      ],
      closing: 'A step forward: take one conviction from the second answer and, this week, say it once out loud to someone who disagrees, and listen to the reply without adding a defence. Note what happened to the conviction.' },
    { kind: 'text', label: 'project', heading: 'Exceptions and other readings',
      html: `<p>Bad days exist. Convictions can have good reasons. People can be exactly what fascinates you about them. The gendered vocabulary is the least useful part of this material and this exercise does not use it: nothing about your sex, gender or orientation is assumed or asked. Jung himself said the figures “remain autonomous” after integration — which is a reason to treat any relationship with an inner other as ongoing rather than as an achievement — and he warned that the conversation with such a figure can feel ludicrous. If it feels like more than that, or if the “other” starts to feel like a real presence with commands, stop and talk to someone.</p>` }
  ],
  sources: [
    { label: 'jung', text: 'Jung, C. G. <em>Two Essays on Analytical Psychology</em>, CW 7, “Anima and Animus” §296–340 (esp. §309°, §316°, §323–324°, §328°, §331–337°); public-domain text, Baynes translation 1928, pp. 207–229. <em>Aion</em>, CW 9ii, ch. III “The Syzygy: Anima and Animus” §20–42 (§20, §24–29, §31–32, §35, §40). <em>The Archetypes and the Collective Unconscious</em>, CW 9i §57, §66; “Concerning the Archetypes, with Special Reference to the Anima Concept” §111–147 (§144°, §146°). <em>Psychological Types</em>, CW 6 §804°, §807°.' },
    { label: 'later', text: 'Hillman, J. <em>Anima: An Anatomy of a Personified Notion</em> (Spring, 1985). Samuels, A. <em>The Plural Psyche</em> (Routledge, 1989), “Beyond the feminine principle”; “Intimate relationships between women and men” (2021). Young-Eisendrath, P. &amp; Wiedemann, F. <em>Female Authority</em> (Guilford, 1987); Young-Eisendrath, P. <em>Gender and Desire: Uncursing Pandora</em> (1997); “The self in analysis”, <em>Journal of Analytical Psychology</em> 53 (2008). Kast, V. “Anima/animus”, in Papadopoulos (ed.) <em>The Handbook of Jungian Psychology</em> (Routledge, 2006). Rowland, S. <em>Jung: A Feminist Revision</em> (Polity, 2002); “Anima, Gender, Feminism” (2011). McKenzie, S. “Queering gender: anima/animus and the paradigm of emergence”, <em>Journal of Analytical Psychology</em> 51 (2006). Goldenberg, N. “A feminist critique of Jung”, <em>Signs</em> 2 (1976). Wehr, D. <em>Jung and Feminism</em> (1987). Carter, M. <em>Psychological Perspectives</em> (2024); Perrin, J. <em>Psychological Perspectives</em> (2024).' },
    { label: 'research', text: 'Dickson, D. H. &amp; Kelly, I. W. “The ‘Barnum effect’ in personality assessment: a review of the literature”, <em>Psychological Reports</em> 57 (1985). See also the projection studies listed under “What gets under your skin”.' }
  ]

{ id: 'dreams', num: 'Six', name: 'Dreams, without a dictionary',
  kicker: 'Jung’s context method; continuity first, compensation as a question',
  summary: 'Jung said “I have no theory about dreams” and called ready-made symbol guides “plain foolishness”. The exercise follows his method — write the dream, establish the context, gather your own associations — and leads with what the research supports before offering his lens.',
  minutes: '20–30 per dream',
  video: { url: '', title: 'Dreams: context, not codebook' },
  tailor: {},
  dreamTailor: {
    often:     'You said you remember dreams often. Keep to one dream at a time; Jung’s method is slow by design, and a series read quickly turns into a dictionary of your own making.',
    sometimes: 'You said you remember dreams sometimes. That is enough. Take the next one that stays with you, or use the exercise on a dream from years ago that you still remember — persistence is itself context.',
    rarely:    'You said you rarely or never remember dreams. That is common, and it says nothing about depth or resistance: recall tracks openness, sleep patterns, nocturnal awakenings and attitude toward dreams (Ruby et al. 2013). If you want to try, the last prompt below is a small, honest method. If not, the rest of this exercise can be read as an account of how Jung worked.',
    skip:      'You chose not to say how often you remember dreams. The exercise works with a single dream, recent or old, or can simply be read.'
  },
  parts: [
    { kind: 'text', label: 'jung', heading: 'What Jung wrote',
      html: `<p>“I have no theory about dreams, I do not know how dreams arise. And I am not at all sure that my way of handling dreams even deserves the name of a ‘method.’ I share all your prejudices against dream-interpretation as the quintessence of uncertainty and arbitrariness. On the other hand, I know that if we meditate on a dream sufficiently long and thoroughly, if we carry it around with us and turn it over and over, something almost always comes of it” (CW 16 §86, “The Aims of Psychotherapy”, 1931).</p>
<p>His method begins with context, not meaning. “When we take up an obscure dream, our first task is not to understand and interpret, but to establish the context with minute care”; “free association will get me nowhere, any more than it would help me to decipher a Hittite inscription” (CW 16, “The Practical Use of Dream-Analysis”, 1934, pp. 148–149). He asked patients to “bring the dream and its context with them in writing”. On fixed meanings he could not have been clearer: “it is commonly supposed that its contents have only one meaning and are marked with an unalterable plus or minus sign. In my humble opinion, this view is too naive” (§330); “it is far wiser in practice not to regard dream-symbols semiotically, i.e., as signs or symptoms of a fixed character, but as true symbols, i.e., as expressions of a content not yet consciously recognized” (§339); “in no single case can we have the a priori certainty that in practice the symbol must be interpreted in that way” (p. 157); “to treat the symbol as if it were not fixed … we must renounce all preconceived opinions, however knowing they make us feel … if the practitioner operates too much with fixed symbols, there is a danger of his falling into mere routine and pernicious dogmatism” (§342). In his last work: “it is plain foolishness to believe in ready-made systematic guides to dream interpretation, as if one could simply buy a reference book and look up a particular symbol. No dream symbol can be separated from the individual who dreams it, and there is no definite or straightforward interpretation of any dream”; and, to his students, “Learn as much as you can about symbolism; then forget it all when you are analyzing a dream” (<em>Man and His Symbols</em>, 1964, Part 1).</p>
<p>Behind this is his idea of the symbol — “the best possible description, or formula, of a relatively unknown fact”, “alive only in so far as it is pregnant with meaning”, impossible to make “from known associations” (Baynes 1923, Definitions, “Symbol” ≈ CW 6 §814–816) — and his theory of compensation: the conscious mind is selective and therefore one-sided, and what it excludes forms “a counterweight”; “as a rule, the unconscious compensation does not run counter to consciousness, but is rather a balancing or supplementing of the conscious orientation” (CW 6 §694°). “The dream rectifies the situation. It contributes the material that was lacking and thereby improves the patient’s attitude” (CW 8 §482). A dream is “a spontaneous self-portrayal, in symbolic form, of the actual situation in the unconscious” (CW 8 §505°), “a theatre in which the dreamer is himself the scene, the player, the prompter, the producer, the author, the public, and the critic” (§509°).</p>` },
    { kind: 'text', label: 'later', heading: 'What came after',
      html: `<p>Jungian dream practice after Jung — von Franz, Hillman, and the analytic schools — kept context and amplification and argued about how much mythological parallel to bring. Hillman’s “stick to the image” pushed against translating a dream into concepts at all. Outside the Jungian world, the mainstream of dream research adopted the <em>continuity hypothesis</em>: “dreams are continuous with waking life; the world of dreaming and the world of waking are one” (Hall &amp; Nordby, as quoted in Schredl 2024), developed by Domhoff’s neurocognitive theory and by Schredl’s programme of studies. Compensation was not so much refuted as left untested, because it is a claim about the dream’s attitude relative to consciousness, which is hard to measure.</p>` },
    { kind: 'text', label: 'research', heading: 'What the evidence says',
      html: `<p>“A vast number of empirical findings support the continuity hypothesis of dreaming”: time spent on an activity predicts its appearance in dreams with medium to large effects — sport students dream of sport, politics students of politics (Schredl 2024). A single study of nightmares found evidence for both continuity and compensation depending on who initiated the aggression (Mathes &amp; Pietrowsky 2022). Dream-recall frequency is predicted by openness to experience, thin boundaries, absorption, nocturnal awakenings and attitude toward dreams (Ruby et al. 2013) — not by depth. Who keeps a dream journal? People who recall more, have more nightmares and like dreams; “unexpectedly, conscientiousness was negatively related to recording dreams” (Schredl &amp; Göritz 2019). So: a journal will over-represent your dream-positive moods; low recall is normal; and the evidence-based first question about any dream is what it continues from your waking life. Jung’s question — what it might be balancing — comes second, as a lens.</p>` },
    { kind: 'prompts', label: 'project', heading: 'The exercise',
      intro: 'One dream. Jung’s order: the dream, the context, your associations. Then two questions, one from the research and one from Jung, and a check on your own reading.',
      prompts: [
        { id: 'd1', q: 'Write the dream as it was — the scene, the figures, what happened, how it ended, how you felt on waking. No interpretation yet.',
          help: 'Jung thought most dreams have a dramatic shape: a setting, a development, a turning point, an outcome. Note whether yours resolves or stops.' },
        { id: 'd2', q: 'Context: what happened the day before, and what has been on your mind this week? What was your attitude — confident, resigned, angry, busy — in the days around the dream?',
          help: '“Establish the context with minute care.” The conscious situation is what any compensation would be compensating.' },
        { id: 'd3', q: 'Associations: for each element that stands out, what comes to you — your own memories and connections, not a book’s? Stay with each element rather than chaining away from it.',
          help: 'Jung distinguished this from free association, which “will get me nowhere”. Circle the image; do not leave it.' },
        { id: 'd4', q: 'Continuity: what in the dream simply continues your waking concerns, activities and feelings?',
          help: 'This is the best-supported reading and usually the largest part of any dream. Give it its due before reaching for anything else.' },
        { id: 'd5', q: 'Compensation, as a question: is there an attitude in the dream that your waking attitude leaves out — a figure who does what you would not, a feeling you have been managing, an outcome you refuse?',
          help: 'Jung’s lens, offered as a question. Compensation is not opposition: the dream may “supplement” rather than contradict. If nothing answers, the lens does not fit this dream.' },
        { id: 'd6', q: 'Which reading survives all of this? Which do you distrust because it flatters you, and which would someone who knows you well laugh at?',
          help: 'Jung: “treat the symbol as if it were not fixed.” A reading that could not be wrong is not a reading.' },
        { id: 'd7', q: 'If you rarely remember dreams and want to: for a week, keep paper by the bed, lie still on waking, and write whatever is there — a feeling, a colour, one word. Record here what came, including nothing.',
          help: 'Attitude toward dreams and attention on waking are the recall correlates you can change. The rest — sleep architecture, awakenings — you cannot, and none of it measures you.' }
      ],
      closing: 'A step forward: carry the dream around for three days, as Jung suggested, and add one line here on the third day. Something almost always comes of it; if nothing does, that is also a fact about this dream.' },
    { kind: 'text', label: 'project', heading: 'Exceptions and other readings',
      html: `<p>Not remembering dreams is not resistance. Recurring nightmares after a frightening event are a clinical matter with effective treatments and belong with a professional, not with a symbol. A dream that repeats an anxiety may be doing exactly that and nothing more. Medication, alcohol, fever and sleep disorders change dreaming. And a symbol you can look up is, by Jung’s own definition, a sign: if the meaning you found came from a list, it is not yet yours.</p>` }
  ],
  sources: [
    { label: 'jung', text: 'Jung, C. G. <em>The Practice of Psychotherapy</em>, CW 16: “The Aims of Psychotherapy” (1931) §86; “The Practical Use of Dream-Analysis” (1934) §294–352, esp. §330, §339, §342 (Pantheon 1954 printing, pp. 148–160). “General Aspects of Dream Psychology” (1916/1948), CW 8 §443–529 (§482, §505°, §509°); “On the Nature of Dreams” (1945/48), CW 8 §530–569 (§545°). <em>Psychological Types</em>, CW 6 Definitions “Compensation” §694°, “Symbol” §814–817° (Baynes 1923). <em>Man and His Symbols</em> (1964), Part 1 “Approaching the Unconscious”.' },
    { label: 'later', text: 'Hillman, J. <em>Archetypal Psychology: A Brief Account</em> (Spring, 1983). von Franz, M.-L. <em>Dreams</em> (Shambhala, 1991). Domhoff, G. W. <em>The Emergence of Dreaming</em> (Oxford, 2018).' },
    { label: 'research', text: 'Schredl, M. “Continuity between waking life and dreaming: a research note and study in adolescents”, <em>Imagination, Cognition and Personality</em> 44 (2024). Mathes, J. &amp; Pietrowsky, R. “Continuity or compensation?”, <em>Consciousness and Cognition</em> 101 (2022). Ruby, P. et al. “Alpha reactivity to first names differs in subjects with high and low dream recall frequency”, <em>Frontiers in Psychology</em> 4 (2013). Schredl, M. &amp; Göritz, A. S. “Who keeps a dream journal?”, <em>Imagination, Cognition and Personality</em> 39 (2019).' }
  ]
},
